<title>Nuvra</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --nv-radius-control:12px;--nv-radius-avatar:16px;--nv-radius-stepper:9px;--nv-radius-badge:8px;--nv-radius-pill:999px;
  --nv-bg:#f3f2f2;--nv-fg:#201e1d;--nv-fg-inverse:#fff;--nv-accent:#ec3013;--nv-on-accent:#fff;
  --nv-positive:#201e1d;--nv-negative:#ec3013;--nv-negative-soft:#ec3013;
  --nv-muted:rgba(32,30,29,.55);--nv-muted-2:rgba(32,30,29,.5);
  --nv-rule-strong:#201e1d;--nv-rule-soft:rgba(32,30,29,.16);--nv-hairline:rgba(32,30,29,.14);
  --nv-track:rgba(32,30,29,.14);--nv-bar-neutral:rgba(32,30,29,.2);--nv-bar-neutral-strong:#201e1d;
  --nv-group-bg:rgba(32,30,29,.05);--nv-alert-bg:rgba(236,48,19,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --nv-bg:#201e1d;--nv-fg:#f3f2f2;--nv-fg-inverse:#201e1d;
    --nv-positive:#7fd6a3;--nv-negative:#ff6a4d;--nv-negative-soft:#ff8f78;
    --nv-muted:rgba(243,242,242,.55);--nv-muted-2:rgba(243,242,242,.5);
    --nv-rule-strong:rgba(243,242,242,.3);--nv-rule-soft:rgba(243,242,242,.2);--nv-hairline:rgba(243,242,242,.14);
    --nv-track:rgba(243,242,242,.18);--nv-bar-neutral:rgba(243,242,242,.28);--nv-bar-neutral-strong:rgba(243,242,242,.8);
    --nv-group-bg:rgba(243,242,242,.06);--nv-alert-bg:rgba(236,48,19,.14);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --nv-bg:#201e1d;--nv-fg:#f3f2f2;--nv-fg-inverse:#201e1d;
  --nv-positive:#7fd6a3;--nv-negative:#ff6a4d;--nv-negative-soft:#ff8f78;
  --nv-muted:rgba(243,242,242,.55);--nv-muted-2:rgba(243,242,242,.5);
  --nv-rule-strong:rgba(243,242,242,.3);--nv-rule-soft:rgba(243,242,242,.2);--nv-hairline:rgba(243,242,242,.14);
  --nv-track:rgba(243,242,242,.18);--nv-bar-neutral:rgba(243,242,242,.28);--nv-bar-neutral-strong:rgba(243,242,242,.8);
  --nv-group-bg:rgba(243,242,242,.06);--nv-alert-bg:rgba(236,48,19,.14);
}
*{box-sizing:border-box;}
html,body{margin:0;}
body{background:var(--nv-bg);color:var(--nv-fg);font-family:Archivo,system-ui,-apple-system,"Segoe UI",sans-serif;}
button,input,select{font-family:inherit;}
/* color-scheme (declarado no :root acima) nem sempre é suficiente pro popup nativo do <select> —
   alguns navegadores (Chrome no Windows, em particular) só respeitam o tema escuro no popup
   quando as <option> também têm cor explícita, não herdada. */
select option{background-color:var(--nv-bg);color:var(--nv-fg);}
:focus-visible{outline:2px solid var(--nv-accent);outline-offset:2px;}
:focus:not(:focus-visible){outline:none;}

.nv-tela{display:flex;flex-direction:column;min-height:100dvh;max-width:480px;margin:0 auto;}
.nv-tela[hidden]{display:none;}

.nv-header{padding:14px 20px 12px;border-bottom:2px solid var(--nv-rule-strong);display:flex;align-items:center;justify-content:space-between;gap:12px;}
.nv-header--back{justify-content:flex-start;gap:12px;}
.nv-brand{display:flex;align-items:center;gap:9px;}
.nv-wordmark{font-size:16px;font-weight:600;letter-spacing:.2em;}
.nv-monthnav{display:flex;align-items:center;gap:10px;}
.nv-monthnav button{background:none;border:none;color:var(--nv-accent);font-size:20px;line-height:1;cursor:pointer;padding:4px;}
.nv-monthnav span{font-size:13px;font-weight:600;letter-spacing:.1em;color:var(--nv-muted);white-space:nowrap;}
.nv-gear{background:none;border:none;color:var(--nv-muted);cursor:pointer;padding:4px;line-height:1;display:inline-flex;align-items:center;}
.nv-title{font-size:22px;font-weight:600;letter-spacing:-.02em;}
.nv-month-label{font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--nv-muted);}
.nv-back{background:none;border:none;color:var(--nv-accent);font-size:20px;line-height:1;cursor:pointer;padding:0;}
.nv-link-muted{font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--nv-muted);background:none;border:none;cursor:pointer;padding:0;}
.nv-link-accent{font-size:10px;font-weight:600;letter-spacing:.08em;color:var(--nv-accent);background:none;border:none;cursor:pointer;padding:0;}


/* Teste de perfil de investidor */
.nv-perfil-convite{margin:16px 20px 0;padding:18px;border:1px solid var(--nv-rule-soft);border-radius:14px;}
.nv-perfil-convite-titulo{font-size:15px;font-weight:600;margin-bottom:6px;}
.nv-perfil-convite p{font-size:12px;color:var(--nv-muted);line-height:1.5;margin:0 0 14px;}
.nv-perfil-cta{font-size:10px;font-weight:600;letter-spacing:.1em;color:var(--nv-bg);background:var(--nv-accent);border:none;border-radius:999px;padding:10px 18px;cursor:pointer;}
.nv-perfil-bloco{border:none;border-top:1px solid var(--nv-rule-soft);padding:14px 0 4px;margin:0;}
.nv-perfil-bloco legend{font-size:12px;font-weight:600;padding:0;margin-bottom:10px;}
.nv-perfil-opcao{display:flex;flex-direction:row;align-items:center;gap:10px;font-size:12px;color:var(--nv-muted);padding:5px 0;margin:0;cursor:pointer;}
.nv-perfil-opcao input{accent-color:var(--nv-accent);flex:none;margin:0;}
.nv-perfil-nome{font-size:30px;font-weight:600;letter-spacing:-.02em;margin-top:6px;}
.nv-perfil-pontos{font-size:11px;color:var(--nv-muted);margin-top:4px;}
.nv-perfil-resumo{font-size:12px;color:var(--nv-muted);line-height:1.5;margin:12px 0 0;}
.nv-perfil-aviso{font-size:10px;line-height:1.5;color:var(--nv-muted);margin:18px 0 0;padding-top:12px;border-top:1px solid var(--nv-rule-soft);}

.nv-hero{padding:22px 20px 18px;border-bottom:2px solid var(--nv-rule-strong);}
.nv-hero-label{font-size:10px;font-weight:600;letter-spacing:.14em;color:var(--nv-muted);}
.nv-hero-value{display:flex;align-items:baseline;gap:6px;margin-top:8px;}
.nv-hero-value .cifrao{font-size:20px;font-weight:600;color:var(--nv-muted);}
.nv-hero-value .numero{font-size:52px;font-weight:600;letter-spacing:-.035em;line-height:.9;font-variant-numeric:tabular-nums;}
.nv-hero-value input{font-family:inherit;background:none;border:none;color:inherit;outline:none;padding:0;width:100%;font-size:52px;font-weight:600;letter-spacing:-.035em;font-variant-numeric:tabular-nums;}
.nv-hero-sub{margin-top:12px;font-size:11px;font-weight:600;color:var(--nv-muted);}

.nv-sparkline{padding:16px 20px 14px;border-bottom:1px solid var(--nv-rule-soft);}
.nv-sparkline-axis{display:flex;justify-content:space-between;margin-top:8px;font-size:9px;font-weight:600;letter-spacing:.1em;color:var(--nv-muted);}

.nv-cells{display:flex;border-bottom:1px solid var(--nv-rule-soft);}
.nv-cells--linha{border-top:1px solid var(--nv-rule-soft);border-bottom:2px solid var(--nv-rule-strong);}
.nv-cell{flex:1;padding:14px 20px;}
.nv-cell+.nv-cell{border-left:1px solid var(--nv-rule-soft);}
.nv-cell-label{font-size:10px;font-weight:600;letter-spacing:.12em;color:var(--nv-muted);}
.nv-cell-valor{font-size:17px;font-weight:600;margin-top:5px;font-variant-numeric:tabular-nums;}
.nv-select-inline{margin-top:3px;font-size:12px;font-weight:600;background:none;border:none;color:inherit;padding:0;width:100%;}

.nv-section-head{padding:16px 20px 8px;display:flex;justify-content:space-between;align-items:baseline;}
.nv-section-label{font-size:10px;font-weight:600;letter-spacing:.14em;color:var(--nv-muted);}
.nv-bars{padding:0 20px 4px;display:flex;flex-direction:column;gap:11px;}
.nv-bar-row{display:flex;flex-direction:column;gap:5px;background:none;border:none;text-align:left;padding:0;font:inherit;color:inherit;cursor:pointer;width:100%;}
.nv-bar-top{display:flex;justify-content:space-between;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;}
.nv-bar-track{height:6px;border-radius:var(--nv-radius-pill);background:var(--nv-track);}
.nv-bar-fill{height:6px;border-radius:var(--nv-radius-pill);}

.nv-list-plain{padding:0 20px 8px;}
.nv-row-plain{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--nv-hairline);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;}
.nv-row-plain:last-child{border-bottom:none;}
.nv-row-plain small{color:var(--nv-muted-2);font-weight:600;margin-left:4px;}

.nv-vazio{color:var(--nv-muted);text-align:center;padding:16px 20px;font-size:.9rem;}

.nv-tabbar{display:flex;border-top:2px solid var(--nv-rule-strong);margin-top:auto;}
.nv-tabbar button{flex:1;padding:12px 0;text-align:center;font-size:10px;font-weight:600;letter-spacing:.1em;color:var(--nv-muted-2);background:none;border:none;cursor:pointer;font-family:inherit;}
.nv-tabbar button.ativo{color:var(--nv-accent);border-top:3px solid var(--nv-accent);margin-top:-3px;}

.nv-search{padding:12px 20px 0;}
.nv-search-box{display:flex;align-items:center;gap:8px;border:2px solid var(--nv-rule-soft);border-radius:var(--nv-radius-control);padding:9px 13px;}
.nv-search-box input{border:none;background:none;outline:none;font:inherit;color:inherit;width:100%;}
.nv-search-box svg{flex:none;color:var(--nv-muted);}
.nv-chips{display:flex;gap:6px;padding:12px 20px;overflow-x:auto;}
.nv-chip{font-size:10px;font-weight:600;letter-spacing:.1em;padding:6px 12px;border-radius:var(--nv-radius-pill);border:1px solid var(--nv-rule-soft);background:none;color:inherit;cursor:pointer;white-space:nowrap;font-family:inherit;}
.nv-chip.ativo{background:var(--nv-accent);border-color:var(--nv-accent);color:var(--nv-on-accent);}

.nv-grupo-lista{flex:1;display:flex;flex-direction:column;}
.nv-grupo-data{padding:9px 20px 6px;font-size:9px;font-weight:600;letter-spacing:.14em;color:var(--nv-muted-2);background:var(--nv-group-bg);}
.nv-item-lanc{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:1px solid var(--nv-hairline);cursor:pointer;background:none;width:100%;text-align:left;border-left:none;border-right:none;border-top:none;font-family:inherit;color:inherit;}
.nv-item-nome{font-size:13px;font-weight:600;}
.nv-item-meta{font-size:11px;color:var(--nv-muted-2);margin-top:2px;}
.nv-item-valor{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;}
.nv-item-valor.positivo{color:var(--nv-positive);}
.nv-item-valor.negativo{color:var(--nv-negative);}
.nv-tag-parcela{font-size:9px;font-weight:600;letter-spacing:.04em;border:1px solid var(--nv-rule-soft);padding:1px 5px;border-radius:var(--nv-radius-pill);margin-left:6px;color:var(--nv-muted);}

.nv-acao-fixa{padding:14px 20px;}
.nv-btn-cheio{background:var(--nv-accent);color:var(--nv-on-accent);padding:14px 18px;border-radius:var(--nv-radius-control);display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;letter-spacing:.12em;border:none;cursor:pointer;width:100%;font-family:inherit;}
.nv-btn-contorno{border:2px solid var(--nv-rule-strong);border-radius:var(--nv-radius-control);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;letter-spacing:.12em;background:none;color:inherit;cursor:pointer;width:100%;font-family:inherit;}
.nv-btn-cheio .mais,.nv-btn-contorno .mais{font-size:18px;line-height:1;}
.nv-btn-contorno .mais{color:var(--nv-accent);}

.nv-segmentado{display:flex;border-bottom:2px solid var(--nv-rule-strong);}
.nv-segmentado button{flex:1;padding:11px 0;text-align:center;font-size:11px;font-weight:600;letter-spacing:.1em;background:none;border:none;cursor:pointer;color:inherit;font-family:inherit;border-left:1px solid var(--nv-rule-soft);}
.nv-valor-grande{padding:18px 20px 4px;}
.nv-segmentado button:first-child{border-left:none;}
.nv-segmentado button.ativo{background:var(--nv-accent);color:var(--nv-on-accent);}

.nv-campo-linha{padding:12px 20px;border-bottom:1px solid var(--nv-rule-soft);display:flex;flex-direction:column;}
.nv-campo-label{font-size:9px;font-weight:600;letter-spacing:.14em;color:var(--nv-muted);}

/* Combobox custom — substitui <select>/<datalist> nativos, cuja aparência de popup (fundo,
   cor de item selecionado) o navegador não deixa a página controlar de forma confiável. */
.nv-combo{position:relative;}
.nv-combo-gatilho{background:none;border:none;color:inherit;font:inherit;padding:0;outline:none;cursor:pointer;width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.nv-combo-gatilho .nv-combo-seta{flex:none;color:var(--nv-muted);}
.nv-combo-input{font-size:15px;font-weight:500;background:none;border:none;color:inherit;width:100%;font-family:inherit;padding:0;outline:none;}
/* Dentro de um dialog (Investimento, Operação, Conta, Provento, Meta) o combo precisa da mesma
   caixa com borda dos outros campos (dialog input) e de espaço embaixo — sem isso, o rótulo
   seguinte fica colado na caixa e tudo parece uma coisa só, difícil de tocar certo. */
dialog .nv-combo{margin-bottom:14px;}
dialog .nv-combo-gatilho,
dialog .nv-combo-input{font-family:inherit;font-size:1rem;padding:8px;border-radius:8px;border:1px solid var(--nv-rule-soft);background:var(--nv-bg);color:var(--nv-fg);}
.nv-combo-lista{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--nv-bg);border:1px solid var(--nv-rule-soft);border-radius:var(--nv-radius-control);max-height:240px;overflow-y:auto;z-index:30;box-shadow:0 10px 28px rgba(0,0,0,.4);}
.nv-combo-lista[hidden]{display:none;}
.nv-combo-item{padding:11px 14px;font-size:14px;font-weight:500;cursor:pointer;}
.nv-combo-item:hover,.nv-combo-item.ativo{background:var(--nv-accent);color:var(--nv-on-accent);}
.nv-combo-item[hidden]{display:none;}
.nv-combo-vazio{padding:11px 14px;font-size:12px;color:var(--nv-muted);}
.nv-campo-linha input,.nv-campo-linha select{font-size:15px;font-weight:500;margin-top:4px;background:none;border:none;color:inherit;width:100%;font-family:inherit;padding:0;outline:none;}
.nv-campo-dupla{display:flex;border-bottom:1px solid var(--nv-rule-soft);}
.nv-campo-dupla>div{flex:1;padding:12px 20px;display:flex;flex-direction:column;}
.nv-campo-dupla>div:first-child{border-right:1px solid var(--nv-rule-soft);}
.nv-campo-dupla input,.nv-campo-dupla select{font-size:15px;font-weight:500;margin-top:4px;background:none;border:none;color:inherit;width:100%;font-family:inherit;padding:0;outline:none;}

.nv-linha-toggle{padding:14px 20px;border-bottom:1px solid var(--nv-rule-soft);display:flex;justify-content:space-between;align-items:center;}
.nv-stepper-linha.desabilitado{opacity:.4;pointer-events:none;}
.nv-switch-wrap{position:relative;display:inline-flex;cursor:pointer;}
.nv-switch-wrap input{position:absolute;opacity:0;width:44px;height:24px;margin:0;cursor:pointer;}
.nv-switch{width:44px;height:24px;border:2px solid var(--nv-muted);border-radius:var(--nv-radius-pill);display:flex;align-items:center;padding:2px;}
.nv-switch .knob{width:16px;height:16px;border-radius:var(--nv-radius-pill);background:var(--nv-muted);transition:transform .15s ease,background .15s ease;}
.nv-switch-wrap input:checked+.nv-switch{border-color:var(--nv-accent);}
.nv-switch-wrap input:checked+.nv-switch .knob{transform:translateX(20px);background:var(--nv-accent);}
.nv-stepper{display:flex;align-items:center;}
.nv-stepper button{width:30px;height:30px;border:1px solid var(--nv-muted);border-radius:var(--nv-radius-stepper);background:none;color:inherit;font-size:15px;cursor:pointer;font-family:inherit;}
.nv-stepper span{width:40px;height:30px;border-top:1px solid var(--nv-muted);border-bottom:1px solid var(--nv-muted);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;}
.nv-rodape-form{margin-top:auto;padding:16px 20px 20px;display:flex;flex-direction:column;gap:10px;}
.nv-rodape-saldo{border-top:2px solid var(--nv-rule-strong);padding-top:14px;display:flex;justify-content:space-between;font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--nv-muted);}
.nv-rodape-saldo span:last-child{color:var(--nv-fg);font-variant-numeric:tabular-nums;}

.nv-barras-meses{padding:18px 20px 14px;border-bottom:1px solid var(--nv-rule-soft);}
.nv-barras-meses-grid{display:flex;align-items:flex-end;gap:10px;height:120px;border-bottom:2px solid var(--nv-rule-strong);}
.nv-barra-mes{flex:1;border-radius:5px 5px 0 0;background:var(--nv-bar-neutral);}
.nv-barra-mes.atual{background:var(--nv-accent);}
.nv-barras-eixo{display:flex;gap:10px;margin-top:8px;font-size:9px;font-weight:600;letter-spacing:.1em;color:var(--nv-muted);}
.nv-barras-eixo span{flex:1;text-align:center;}
.nv-meta-linha{padding:14px 20px;border-bottom:1px solid var(--nv-rule-soft);display:flex;justify-content:space-between;align-items:center;}
.nv-badge{font-size:12px;font-weight:600;padding:4px 9px;border-radius:var(--nv-radius-badge);background:var(--nv-fg);color:var(--nv-bg);}

.nv-orcamento{padding:22px 20px 18px;border-bottom:2px solid var(--nv-rule-strong);}
.nv-orcamento-num{display:flex;align-items:baseline;gap:8px;margin-top:8px;flex-wrap:wrap;}
.nv-orcamento-num .grande{font-size:46px;font-weight:600;letter-spacing:-.03em;line-height:.9;font-variant-numeric:tabular-nums;}
.nv-orcamento-num .pct{font-size:22px;font-weight:600;}
.nv-orcamento-num .detalhe{font-size:12px;font-weight:600;color:var(--nv-muted);margin-left:6px;}
.nv-orcamento-track{height:8px;border-radius:var(--nv-radius-pill);background:var(--nv-track);margin-top:14px;}
.nv-orcamento-fill{height:8px;border-radius:var(--nv-radius-pill);background:var(--nv-fg);}
.nv-orcamento-sub{margin-top:8px;font-size:11px;font-weight:600;color:var(--nv-muted);}
.nv-meta-item{padding:15px 20px;border-bottom:1px solid var(--nv-rule-soft);cursor:pointer;}
.nv-meta-item.excedida{background:var(--nv-alert-bg);}
.nv-meta-topo{display:flex;justify-content:space-between;align-items:baseline;}
.nv-meta-nome{font-size:14px;font-weight:600;}
.nv-meta-valores{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;}
.nv-meta-valores.excedida{color:var(--nv-negative-soft);}
.nv-meta-track{height:6px;border-radius:var(--nv-radius-pill);background:var(--nv-track);margin-top:9px;}
.nv-meta-fill{height:6px;border-radius:var(--nv-radius-pill);background:var(--nv-fg);}
.nv-meta-fill.excedida{background:var(--nv-accent);}
.nv-meta-excesso{margin-top:8px;font-size:11px;font-weight:600;color:var(--nv-negative-soft);}

.nv-perfil{padding:18px 20px;border-bottom:2px solid var(--nv-rule-strong);display:flex;align-items:center;gap:14px;}
.nv-avatar{width:52px;height:52px;border-radius:var(--nv-radius-avatar);background:var(--nv-fg);color:var(--nv-bg);display:flex;align-items:center;justify-content:center;}
.nv-perfil-nome{font-size:16px;font-weight:600;}
.nv-perfil-sub{font-size:11px;color:var(--nv-muted);margin-top:3px;}
.nv-segmentado-tema{display:flex;border:2px solid var(--nv-muted);border-radius:var(--nv-radius-control);overflow:hidden;}
.nv-segmentado-tema button{flex:1;padding:10px 0;text-align:center;font-size:11px;font-weight:600;letter-spacing:.1em;background:none;border:none;cursor:pointer;color:inherit;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;}
.nv-segmentado-tema button.ativo{background:var(--nv-fg);color:var(--nv-bg);}
.nv-conta-linha{display:flex;justify-content:space-between;align-items:center;padding:11px 20px;border-bottom:1px solid var(--nv-hairline);}
.nv-conta-marcador{width:30px;height:30px;border-radius:var(--nv-radius-stepper);border:1px dashed var(--nv-muted-2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--nv-muted);}
.nv-monograma{border-radius:50%;color:#f3f2f2;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none;letter-spacing:-.02em;}
.nv-dado-linha{display:flex;justify-content:space-between;align-items:center;padding:13px 20px;border-bottom:1px solid var(--nv-hairline);}
.nv-rodape-versao{margin-top:auto;padding:16px 20px;font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--nv-muted-2);}

<script>

// tem preço nenhum aqui). Serve só de ponto de partida no autocomplete; o campo continua
// aceitando qualquer texto digitado livremente, esteja ou não nesta lista. Só "Outro" fica sem
// lista de propósito — é o catch-all genérico.

    'CSAN3', 'UGPA3', 'CRFB3', 'AZUL4', 'GOLL4', 'CVCB3', 'YDUQ3', 'COGN3', 'MRVE3', 'HYPE3',

    'V', 'MA', 'UNH', 'HD', 'PG', 'JNJ', 'XOM', 'WMT', 'DIS', 'NFLX',
    'KO', 'PEP', 'ADBE', 'CRM', 'INTC', 'AMD', 'CSCO', 'ORCL', 'IBM', 'NKE',

  bdr: [

function listaSugeridaPorTipo(tipo) {
  return ATIVOS_SUGERIDOS[tipo] || [];
}

// Hash não-criptográfico simples pra não guardar o PIN em claro no localStorage. Não é segurança
// de verdade (é só uma trava de acesso casual, não protege contra alguém sofisticado) — serve
// apenas pra não deixar o PIN legível de bandeja no localStorage.
function hashSimples(texto) {
  let hash = 0;
  for (let i = 0; i < texto.length; i += 1) {
    hash = (hash * 31 + texto.charCodeAt(i)) >>> 0;
  }
  return hash.toString(36);
}

function uid() {
  return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
}

function parcelaValor(lancamento) {
  const parcelas = lancamento.parcelas || 1;
  return lancamento.valorTotal / parcelas;
}

function parcelaNoMes(lancamento, ano, mes) {
  const [anoIni, mesIni] = lancamento.data.split('-').map(Number);
  const inicioIndex = anoIni * 12 + (mesIni - 1);
  const alvoIndex = ano * 12 + (mes - 1);
  const diff = alvoIndex - inicioIndex;
  const parcelas = lancamento.parcelas || 1;
  if (diff < 0 || diff >= parcelas) {
    return { noMes: false, numeroParcela: null };
  }
  return { noMes: true, numeroParcela: diff + 1 };
}

function resumoMensal(lancamentos, ano, mes) {
  let receitas = 0;
  let despesas = 0;
  for (const l of lancamentos) {
    const { noMes } = parcelaNoMes(l, ano, mes);
    if (!noMes) continue;
    const valor = parcelaValor(l);
    if (l.tipo === 'receita') receitas += valor;
    else if (l.tipo === 'despesa') despesas += valor;
  }
  return { receitas, despesas, saldo: receitas - despesas };
}

function parcelasEmAberto(lancamentos, ano, mes) {
  const resultado = [];
  for (const l of lancamentos) {
    const parcelas = l.parcelas || 1;
    if (parcelas <= 1) continue;
    const { noMes, numeroParcela } = parcelaNoMes(l, ano, mes);
    if (!noMes) continue;
    resultado.push({
      id: l.id,
      descricao: l.descricao,
      valorParcela: parcelaValor(l),
      numeroParcela,
      parcelas,
      restantes: parcelas - numeroParcela,
    });
  }
  return resultado;
}

function rendimento(investido, atual) {
  const valor = atual - investido;
  const percentual = investido === 0 ? 0 : (valor / investido) * 100;
  return { valor, percentual };
}

// Reprocessa o histórico de operações em ordem cronológica, mantendo quantidade e custo total
// acumulados, e registrando cada venda com o lucro realizado (preço de venda − preço médio
// naquele momento). posicaoAtivo e historicoRealizado são só recortes deste resultado.
function processarOperacoes(operacoes) {
  const ordenadas = [...(operacoes || [])].sort((a, b) => a.data.localeCompare(b.data));
  let quantidade = 0;
  let custoTotal = 0;
  const vendas = [];
  for (const op of ordenadas) {
    if (op.tipo === 'compra') {
      quantidade += op.quantidade;
      custoTotal += op.quantidade * op.precoUnitario;
    } else if (op.tipo === 'venda') {
      if (op.quantidade > quantidade) {
        throw new Error(`Venda de ${op.quantidade} unidades excede a posição atual de ${quantidade}.`);
      }
      const precoMedioNaVenda = quantidade === 0 ? 0 : custoTotal / quantidade;
      custoTotal -= op.quantidade * precoMedioNaVenda;
      quantidade -= op.quantidade;
      vendas.push({
        operacaoId: op.id,
        data: op.data,
        quantidade: op.quantidade,
        precoVenda: op.precoUnitario,
        precoMedioNaVenda,
        valorVendido: op.quantidade * op.precoUnitario,
        lucro: (op.precoUnitario - precoMedioNaVenda) * op.quantidade,
      });
    }
  }
  return { quantidade, precoMedio: quantidade === 0 ? 0 : custoTotal / quantidade, custoTotal, vendas };
}

// Calcula quantidade e preço médio ponderado de um ativo a partir do histórico de operações.
// Vendas reduzem a quantidade mas não alteram o preço médio (custo proporcional é retirado).
function posicaoAtivo(operacoes) {
  const { quantidade, precoMedio, custoTotal } = processarOperacoes(operacoes);
  return { quantidade, precoMedio, custoTotal };
}

// Lista o lucro realizado de cada venda (preço de venda − preço médio no momento da venda),
// na ordem cronológica das operações — base pro cálculo de imposto estimado.
function historicoRealizado(operacoes) {
  return processarOperacoes(operacoes).vendas;
}

// Converte um investimento no formato antigo (valorInvestido/valorAtual fixos) numa 1ª operação
// de compra sintética com quantidade=1, preservando o dado sem exigir migração manual do usuário.
function migrarInvestimentoLegado(investimento) {
  if (investimento.operacoes) return investimento;
  const { valorInvestido, valorAtual, ...resto } = investimento;
  const data = investimento.atualizadoEm || new Date().toISOString().slice(0, 10);
  return {
    ...resto,
    precoAtual: valorAtual || 0,
    operacoes: [{ id: uid(), tipo: 'compra', data, quantidade: 1, precoUnitario: valorInvestido || 0 }],
  };
}

function resumoInvestimento(investimentoBruto) {
  const investimento = migrarInvestimentoLegado(investimentoBruto);
  const { quantidade, precoMedio } = posicaoAtivo(investimento.operacoes);
  const precoAtual = investimento.precoAtual || 0;
  const valorInvestido = quantidade * precoMedio;
  const valorAtual = quantidade * precoAtual;
  const { valor, percentual } = rendimento(valorInvestido, valorAtual);
  return { quantidade, precoMedio, precoAtual, valorInvestido, valorAtual, rendimentoValor: valor, rendimentoPercentual: percentual };
}

function totalCarteira(investimentos) {
  const resumos = investimentos.map(resumoInvestimento);
  const totalInvestido = resumos.reduce((s, r) => s + r.valorInvestido, 0);
  const totalAtual = resumos.reduce((s, r) => s + r.valorAtual, 0);
  const { valor, percentual } = rendimento(totalInvestido, totalAtual);
  return { totalInvestido, totalAtual, rendimentoValor: valor, rendimentoPercentual: percentual };
}

// Soma o valor atual da carteira agrupado por tipo de ativo (ação/fii/renda_fixa/outro),
// do maior para o menor.
function composicaoPorTipo(investimentos) {
  const composicao = [];
  for (const inv of investimentos) {
    const { valorAtual } = resumoInvestimento(inv);
    const existente = composicao.find((c) => c.tipo === inv.tipo);
    if (existente) existente.valor += valorAtual;
    else composicao.push({ tipo: inv.tipo, valor: valorAtual });
  }
  return composicao.sort((a, b) => b.valor - a.valor);
}

// Compara a composição atual da carteira com a alocação-alvo (% por tipo) e devolve, pra cada
// tipo com meta definida, o quanto falta em R$ pra chegar nela — do maior déficit pro menor.
// Um valor de "diferenca" negativo indica que o tipo já está acima da meta.
function sugestaoAporte(investimentos, alocacaoAlvo) {
  if (!alocacaoAlvo) return [];
  const composicao = composicaoPorTipo(investimentos);
  const totalAtual = composicao.reduce((s, c) => s + c.valor, 0);
  return Object.keys(alocacaoAlvo)
    .map((tipo) => {
      const atual = (composicao.find((c) => c.tipo === tipo) || { valor: 0 }).valor;
      const ideal = (alocacaoAlvo[tipo] / 100) * totalAtual;
      return { tipo, atual, ideal, diferenca: ideal - atual };
    })
    .sort((a, b) => b.diferenca - a.diferenca);
}

function totalProventos(proventos) {
  return (proventos || []).reduce((s, p) => s + p.valor, 0);
}

// Estimativa de imposto de renda sobre ganho de capital em ações e FIIs, mês a mês.
// Ações: isentas se o total vendido no mês (todos os ativos do tipo, somados) não passar de
// R$20.000; senão, 15% sobre o lucro líquido do mês. FIIs: sempre 20% sobre o lucro líquido do
// mês, sem isenção por valor vendido. Day-trade e renda fixa/outro ficam fora (regras diferentes).
// É uma estimativa de apoio à decisão — não substitui cálculo de contador pra fins de DARF.
const REGRAS_IMPOSTO_CARTEIRA = {
  acao: { aliquota: 0.15, limiteIsencaoVendas: 20000 },
  fii: { aliquota: 0.2, limiteIsencaoVendas: 0 },
};

function impostoEstimadoMes(investimentos, ano, mes) {
  const porTipo = {};
  for (const inv of investimentos) {
    const regra = REGRAS_IMPOSTO_CARTEIRA[inv.tipo];
    if (!regra) continue;
    const investimentoMigrado = migrarInvestimentoLegado(inv);
    const vendasDoMes = historicoRealizado(investimentoMigrado.operacoes).filter((v) => {
      const [anoVenda, mesVenda] = v.data.split('-').map(Number);
      return anoVenda === ano && mesVenda === mes;
    });
    if (!vendasDoMes.length) continue;
    if (!porTipo[inv.tipo]) porTipo[inv.tipo] = { tipo: inv.tipo, totalVendido: 0, lucroLiquido: 0 };
    for (const venda of vendasDoMes) {
      porTipo[inv.tipo].totalVendido += venda.valorVendido;
      porTipo[inv.tipo].lucroLiquido += venda.lucro;
    }
  }
  return Object.values(porTipo).map((item) => {
    const regra = REGRAS_IMPOSTO_CARTEIRA[item.tipo];
    const isento = regra.limiteIsencaoVendas > 0 && item.totalVendido <= regra.limiteIsencaoVendas;
    const lucroTributavel = isento ? 0 : Math.max(0, item.lucroLiquido);
    return { ...item, isento, lucroTributavel, aliquota: regra.aliquota, impostoEstimado: lucroTributavel * regra.aliquota };
  });
}

function indiceMes(ano, mes) {
  return ano * 12 + (mes - 1);
}

function mesPorIndice(indice) {
  return { ano: Math.floor(indice / 12), mes: (((indice % 12) + 12) % 12) + 1 };
}

function filtrarLancamentos(lancamentos, ano, mes, opcoes = {}) {
  const { busca = '', filtro = 'todos', contaId = null } = opcoes;
  const buscaNormalizada = busca.trim().toLowerCase();

  return lancamentos
    .map((l) => ({ lancamento: l, parcela: parcelaNoMes(l, ano, mes) }))
    .filter((item) => item.parcela.noMes)
    .filter((item) => {
      if (filtro === 'receitas') return item.lancamento.tipo === 'receita';
      if (filtro === 'despesas') return item.lancamento.tipo === 'despesa';
      if (filtro === 'parcelados') return (item.lancamento.parcelas || 1) > 1;
      return true;
    })
    .filter((item) => !contaId || item.lancamento.contaId === contaId)
    .filter((item) => {
      if (!buscaNormalizada) return true;
      const alvo = `${item.lancamento.descricao} ${item.lancamento.categoria}`.toLowerCase();
      return alvo.includes(buscaNormalizada);
    })
    .map((item) => ({ ...item.lancamento, numeroParcela: item.parcela.numeroParcela }))
    .sort((a, b) => b.data.localeCompare(a.data));
}

function totalFiltrado(itensFiltrados) {
  return itensFiltrados.reduce(
    (soma, l) => soma + (l.tipo === 'receita' ? parcelaValor(l) : -parcelaValor(l)),
    0
  );
}

function resumoUltimosMeses(lancamentos, ano, mes, quantidade = 7) {
  const alvo = indiceMes(ano, mes);
  const resultado = [];
  for (let i = quantidade - 1; i >= 0; i -= 1) {
    const { ano: anoAlvo, mes: mesAlvo } = mesPorIndice(alvo - i);
    const { saldo } = resumoMensal(lancamentos, anoAlvo, mesAlvo);
    resultado.push({ ano: anoAlvo, mes: mesAlvo, saldo });
  }
  return resultado;
}

function gastosPorCategoria(lancamentos, ano, mes) {
  const totais = new Map();
  for (const l of lancamentos) {
    if (l.tipo !== 'despesa') continue;
    const { noMes } = parcelaNoMes(l, ano, mes);
    if (!noMes) continue;
    totais.set(l.categoria, (totais.get(l.categoria) || 0) + parcelaValor(l));
  }
  return [...totais.entries()]
    .map(([categoria, valor]) => ({ categoria, valor }))
    .sort((a, b) => b.valor - a.valor);
}

function gastoCategoriaUltimosMeses(lancamentos, categoria, ano, mes, quantidade = 6) {
  const alvo = indiceMes(ano, mes);
  const resultado = [];
  for (let i = quantidade - 1; i >= 0; i -= 1) {
    const { ano: anoAlvo, mes: mesAlvo } = mesPorIndice(alvo - i);
    const item = gastosPorCategoria(lancamentos, anoAlvo, mesAlvo).find((c) => c.categoria === categoria);
    resultado.push({ ano: anoAlvo, mes: mesAlvo, valor: item ? item.valor : 0 });
  }
  return resultado;
}

function statusMeta(gastoAtual, limite) {
  if (!limite || limite <= 0) return { percentual: 0, excedeu: false, excedente: 0 };
  const percentual = (gastoAtual / limite) * 100;
  const excedeu = gastoAtual > limite;
  return { percentual, excedeu, excedente: excedeu ? gastoAtual - limite : 0 };
}

// --- Calculadoras ---

// Avança o saldo em um mês: primeiro aplica a taxa sobre o saldo já existente, depois soma o
// aporte do mês (aporte entra "depois de render o mês", não antes). jurosCompostos e
// mesesParaAtingirMeta reusam este passo pra ficarem sempre consistentes entre si; a fórmula
// fechada de aporteNecessarioParaMeta foi deduzida a partir da mesma ordem (juros → aporte).
function passoMesJurosCompostos(saldo, taxaMensal, aporteMensal) {
  return saldo + saldo * taxaMensal + aporteMensal;
}

function jurosCompostos({ capitalInicial = 0, aporteMensal = 0, taxaMensal = 0, meses = 0 }) {
  let saldo = capitalInicial;
  for (let i = 0; i < meses; i += 1) {
    saldo = passoMesJurosCompostos(saldo, taxaMensal, aporteMensal);
  }
  const totalInvestido = capitalInicial + aporteMensal * meses;
  return { montanteFinal: saldo, totalInvestido, totalJuros: saldo - totalInvestido };
}

function jurosSimples({ capitalInicial = 0, taxaMensal = 0, meses = 0 }) {
  const montanteFinal = capitalInicial * (1 + taxaMensal * meses);
  return { montanteFinal, jurosTotal: montanteFinal - capitalInicial };
}

function percentualDeValor(percentual, valor) {
  return (percentual / 100) * valor;
}

function valorEQuePercentualDoTotal(valor, total) {
  if (total === 0) return 0;
  return (valor / total) * 100;
}

// Percentual positivo aumenta o valor, negativo diminui — é a mesma conta nos dois casos.
function aplicarVariacaoPercentual(valor, percentual) {
  return valor * (1 + percentual / 100);
}

// Teto de segurança pra calculadora "primeiro milhão": sem aporte e sem taxa (ou com valor-alvo
// já inatingível nesse horizonte), o saldo nunca cresce — sem este limite o laço giraria pra
// sempre. 1200 meses = 100 anos é bem além de qualquer plano de vida realista.
const LIMITE_MESES_PRIMEIRO_MILHAO = 1200;

// Quantos meses faltam, com um aporte mensal fixo, pra sair do capital inicial e chegar no
// valor-alvo. Usa o mesmo passo mês a mês de jurosCompostos, então os dois cálculos nunca
// divergem entre si.
function mesesParaAtingirMeta({ capitalInicial = 0, aporteMensal = 0, taxaMensal = 0, valorAlvo }) {
  let saldo = capitalInicial;
  if (saldo >= valorAlvo) return { meses: 0, anos: 0 };
  let meses = 0;
  while (saldo < valorAlvo) {
    saldo = passoMesJurosCompostos(saldo, taxaMensal, aporteMensal);
    meses += 1;
    if (meses >= LIMITE_MESES_PRIMEIRO_MILHAO) return { meses: null, anos: null };
  }
  return { meses, anos: meses / 12 };
}

// Qual aporte mensal fixo, ao longo de um prazo definido, leva do capital inicial ao valor-alvo.
// Fórmula fechada da anuidade ordinária (contribuição após o juro do mês), coerente com a mesma
// ordem usada em passoMesJurosCompostos — por isso os dois cálculos se verificam um ao outro.
function aporteNecessarioParaMeta({ capitalInicial = 0, meses, taxaMensal = 0, valorAlvo }) {
  if (!meses || meses <= 0) return { aporteMensal: null };
  if (taxaMensal === 0) {
    return { aporteMensal: Math.max(0, (valorAlvo - capitalInicial) / meses) };
  }
  const capitalFuturo = capitalInicial * Math.pow(1 + taxaMensal, meses);
  const fatorAnuidade = (Math.pow(1 + taxaMensal, meses) - 1) / taxaMensal;
  return { aporteMensal: Math.max(0, (valorAlvo - capitalFuturo) / fatorAnuidade) };
}

// --- Perfil de investidor ---

// Questionário de suitability no formato padrão do mercado: mede tolerância a perda, prazo,
// experiência e colchão de emergência. As opções vêm sempre da mais conservadora (0) pra mais
// arrojada (3), então a soma bruta já é a pontuação — não precisa de tabela de conversão.

    ],
  },
];

// Soma as respostas (0-12) e corta em três faixas. Resposta faltando conta zero, então um
// questionário incompleto cai pro lado conservador em vez de quebrar.
function perguntasPerfil() {
  return PERGUNTAS_PERFIL;
}

function perfilDeInvestidor(respostas = {}) {
  let pontos = 0;
  for (const p of PERGUNTAS_PERFIL) pontos += Number(respostas[p.id]) || 0;
  const perfil = pontos <= 4 ? 'conservador' : pontos <= 8 ? 'moderado' : 'arrojado';
  return { pontos, perfil };
}

// IMPORTANTE — isto é deliberadamente uma sugestão de proporção por CLASSE de ativo, nunca de
// ativo específico: recomendar um papel a uma pessoa é atividade regulada pela CVM (consultoria
// de valores mobiliários) e exige credenciamento, coisa que um aviso de isenção não substitui.
// Distribuir percentual entre classes é conteúdo educativo, e alimenta a meta de alocação que o
// app já tinha. Cada perfil soma exatamente 100 (coberto por teste).
// Fonte única dos tipos que participam da meta de alocação — o formulário manual (shell.html /
// app.js) e a sugestão por perfil leem daqui. Se as duas listas divergissem, o usuário perderia
// em silêncio os tipos definidos pelo perfil ao salvar o formulário manual.
const TIPOS_ALOCACAO = ['acao', 'fii', 'etf_internacional', 'tesouro_direto', 'renda_fixa', 'criptomoeda', 'outro'];

const ALOCACAO_POR_PERFIL = {
  conservador: { tesouro_direto: 45, renda_fixa: 35, fii: 15, acao: 5 },
  moderado: { tesouro_direto: 20, renda_fixa: 20, fii: 25, acao: 30, etf_internacional: 5 },
  arrojado: { renda_fixa: 10, fii: 20, acao: 40, etf_internacional: 20, criptomoeda: 10 },
};

function tiposAlocacao() {
  return TIPOS_ALOCACAO;
}

function alocacaoSugeridaPorPerfil(perfil) {
  const alocacao = ALOCACAO_POR_PERFIL[perfil];
  return alocacao ? { ...alocacao } : null;
}

// Junta os dividendos previstos (cadastrados manualmente pelo usuário, não vêm de nenhuma fonte
// de mercado — ver restrição de plataforma) de todos os ativos numa única agenda, ignorando datas
// já passadas em relação a dataReferencia e ordenando do mais próximo pro mais distante.
function proximosDividendosPrevistos(investimentos, dataReferencia) {
  const hoje = dataReferencia || new Date().toISOString().slice(0, 10);
  const todos = [];
  for (const inv of investimentos) {
    for (const p of inv.proventosPrevistos || []) {
      todos.push({ investimentoId: inv.id, nome: inv.nome, ...p });
    }
  }
  return todos.filter((p) => p.data >= hoje).sort((a, b) => a.data.localeCompare(b.data));
}

// --- Monograma do ativo (ícone) ---
// O app não pode carregar logo de marca de fora (CSP do Artifact) nem reproduzir a arte de uma
// empresa sem licença — em vez disso, cada ativo ganha um "monograma": duas letras + uma cor
// derivada do próprio nome, sempre a mesma pra um dado ativo. A escolha da paleta de cores em si
// é responsabilidade de render.js (é uma questão de apresentação); aqui só fica o cálculo puro
// das iniciais e do índice na paleta.

function iniciaisAtivo(nome) {
  const texto = (nome || '').trim();
  if (!texto) return '?';
  const palavras = texto.split(/\s+/);
  if (palavras.length > 1) {
    return (palavras[0][0] + palavras[1][0]).toUpperCase();
  }
  return texto.slice(0, 2).toUpperCase();
}

// Reaproveita hashSimples (já usado pro PIN) só como gerador determinístico de índice — não tem
// nenhuma relação com segurança aqui, é só "sempre o mesmo ativo cai na mesma cor".
function corIndiceAtivo(nome, quantidadeCores) {
  if (!quantidadeCores) return 0;
  return parseInt(hashSimples(nome || ''), 36) % quantidadeCores;
}

// Parser de taxa/percentual pros campos de texto da calculadora que NÃO são .nv-campo-moeda —
// esses aceitam tanto vírgula (padrão brasileiro) quanto ponto (o que o teclado numérico de
// celular normalmente digita) como separador decimal, sem exigir formatação. Bug real que isso
// corrige: antes, "1.5" virava silenciosamente 15 (o parser de moeda trata ponto como separador de
// milhar) — aqui o separador mais à direita na string é sempre tratado como o decimal, e qualquer
// outro antes dele como agrupador de milhar, então funciona com os dois estilos.
function numeroDecimalFlexivel(texto) {
  const limpo = String(texto || '').trim();
  if (!limpo) return 0;
  const ultimaVirgula = limpo.lastIndexOf(',');
  const ultimoPonto = limpo.lastIndexOf('.');
  let normalizado;
  if (ultimaVirgula === -1 && ultimoPonto === -1) {
    normalizado = limpo;
  } else if (ultimaVirgula > ultimoPonto) {
    normalizado = limpo.replace(/\./g, '').replace(',', '.');
  } else {
    normalizado = limpo.replace(/,/g, '');
  }
  const numero = Number(normalizado);
  return Number.isFinite(numero) ? numero : 0;
}

function estadoInicial() {
  return {
    lancamentos: [],
    investimentos: [],
    contas: [],
    metas: [],
    tema: 'escuro',
    ocultarValores: false,
    alocacaoAlvo: null,
    idioma: 'pt',
  };
}

function applyAction(state, action) {
  const lancamentos = state.lancamentos ? state.lancamentos.slice() : [];
  const investimentos = state.investimentos ? state.investimentos.slice() : [];
  const contas = state.contas ? state.contas.slice() : [];
  const metas = state.metas ? state.metas.slice() : [];
  const tema = state.tema || 'escuro';
  const ocultarValores = state.ocultarValores || false;
  const alocacaoAlvo = state.alocacaoAlvo || null;
  const idioma = state.idioma || 'pt';
  const base = { lancamentos, investimentos, contas, metas, tema, ocultarValores, alocacaoAlvo, idioma };

  switch (action.type) {
    case 'addLancamento':
      return { ...base, lancamentos: [...lancamentos, action.lancamento] };
    case 'editLancamento':
      return {
        ...base,
        lancamentos: lancamentos.map((l) => (l.id === action.id ? { ...l, ...action.changes } : l)),
      };
    case 'deleteLancamento':
      return { ...base, lancamentos: lancamentos.filter((l) => l.id !== action.id) };
    case 'addInvestimento':
      return { ...base, investimentos: [...investimentos, action.investimento] };
    case 'editInvestimento':
      return {
        ...base,
        investimentos: investimentos.map((i) => (i.id === action.id ? { ...i, ...action.changes } : i)),
      };
    case 'deleteInvestimento':
      return { ...base, investimentos: investimentos.filter((i) => i.id !== action.id) };
    case 'addConta':
      return { ...base, contas: [...contas, action.conta] };
    case 'editConta':
      return { ...base, contas: contas.map((c) => (c.id === action.id ? { ...c, ...action.changes } : c)) };
    case 'deleteConta':
      return { ...base, contas: contas.filter((c) => c.id !== action.id) };
    case 'addMeta':
      return { ...base, metas: [...metas, action.meta] };
    case 'editMeta':
      return { ...base, metas: metas.map((m) => (m.id === action.id ? { ...m, ...action.changes } : m)) };
    case 'deleteMeta':
      return { ...base, metas: metas.filter((m) => m.id !== action.id) };
    case 'setTema':
      return { ...base, tema: action.tema };
    case 'setOcultarValores':
      return { ...base, ocultarValores: !!action.valor };
    case 'setAlocacaoAlvo':
      return { ...base, alocacaoAlvo: action.alocacaoAlvo };
    case 'setIdioma':
      return { ...base, idioma: action.idioma };
    default:
      throw new Error(`Ação desconhecida: ${action.type}`);
  }
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = {
    uid,

function t(chave, idioma) {
  const dicionario = TRADUCOES[idioma] || TRADUCOES[IDIOMA_PADRAO];
  return dicionario[chave] ?? TRADUCOES[IDIOMA_PADRAO][chave] ?? chave;
}

function mesesDoIdioma(idioma) {
  return MESES_POR_IDIOMA[idioma] || MESES_POR_IDIOMA[IDIOMA_PADRAO];
}

function localeDoIdioma(idioma) {
  return LOCALE_POR_IDIOMA[idioma] || LOCALE_POR_IDIOMA[IDIOMA_PADRAO];
}

// clássico (ver build.js), só `function` no topo do arquivo vira propriedade de `window`
// automaticamente — um `const` não vira, e ficaria undefined pro resto do app no navegador.
function listaIdiomas() {
  return IDIOMAS;
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = { IDIOMA_PADRAO, IDIOMAS, t, mesesDoIdioma, localeDoIdioma, listaIdiomas, TRADUCOES };
}

// formulário (hoje só o "Outros" que a composição da carteira usa pra agrupar o 7º tipo em
// diante) — fica fora de ROTULOS_TIPO_INVESTIMENTO de propósito, senão viraria uma opção
// escolhível ao criar um ativo.
const ROTULOS_GRUPO_SINTETICO = {
  outros_agrupados: 'Outros',
};

function rotuloTipoInvestimento(tipo) {
  return ROTULOS_TIPO_INVESTIMENTO[tipo] || ROTULOS_GRUPO_SINTETICO[tipo] || tipo;
}

const ROTULOS_TIPO_CONTA = {
  cartao: 'Cartão',
  conta: 'Conta corrente',
  carteira: 'Carteira',
};

const OCULTO = '••••';

// idioma é opcional (default português) — o valor em si nunca deixa de ser real brasileiro
// (não tem conversão de moeda aqui), só o separador de milhar/decimal e a posição do "R$" mudam
// pra convenção de cada idioma. currencyDisplay:'narrowSymbol' garante "R$" nos três idiomas —
// sem isso o ICU mostra "BRL" por extenso em espanhol em vez do símbolo.
function formatCurrency(valor, idioma) {
  return new Intl.NumberFormat(I18N.localeDoIdioma(idioma), { style: 'currency', currency: 'BRL', currencyDisplay: 'narrowSymbol' }).format(valor);
}

function formatNumero(valor, idioma) {
  return new Intl.NumberFormat(I18N.localeDoIdioma(idioma), { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(valor);
}

function formatPercent(valor, idioma) {
  const formatado = formatNumero(valor, idioma);
  return `${valor >= 0 ? '+' : ''}${formatado}%`;
}

// Anos aparecem com uma casa decimal só (18,2 anos), diferente de formatNumero, que sempre usa
// duas. Passa pelo Intl para o separador acompanhar o idioma — toFixed devolveria sempre ponto.
function formatAnos(valor, idioma) {
  return new Intl.NumberFormat(I18N.localeDoIdioma(idioma), { minimumFractionDigits: 1, maximumFractionDigits: 1 }).format(valor);
}

function escapeHtml(texto) {
  return String(texto)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Esconde valores monetários quando state.ocultarValores está ativo, mantendo a largura tabular.
function mascarar(textoFormatado, ocultarValores) {
  return ocultarValores ? OCULTO : textoFormatado;
}

function iconSymbol(size = 20, corTraco = 'currentColor', corLaje = 'var(--nv-accent)') {
  return `<svg width="${size}" height="${size}" viewBox="0 0 20 20" aria-hidden="true"><rect x="1" y="1" width="18" height="18" rx="4" fill="none" stroke="${corTraco}" stroke-width="2"></rect><path d="M4 16 L16 4 L16 9.5 L9.5 16 Z" fill="${corLaje}"></path></svg>`;
}

// Função (não const) de propósito — no bundle do navegador (script clássico, sem módulos),
// `function` no nível superior vira propriedade de window automaticamente, mas `const` não.
// ROTULOS_TIPO_INVESTIMENTO sozinho não estaria acessível via `renderizacao.` no app.js.
function opcoesTipoInvestimento() {
  return Object.entries(ROTULOS_TIPO_INVESTIMENTO).map(([valor, rotulo]) => ({ valor, rotulo }));
}

// Combobox custom (dropdown com fundo/cor de seleção controlados pelo app) — substitui
// <select>/<datalist> nativos, cujo popup o navegador não deixa estilizar de forma confiável

function renderComboItens(opcoes, valorAtual) {
  return opcoes.length
    ? opcoes
        .map(
          (o) =>
            `<div class="nv-combo-item ${o.valor === valorAtual ? 'ativo' : ''}" data-acao="selecionar-combo-item" data-valor="${escapeHtml(o.valor)}" data-rotulo="${escapeHtml(o.rotulo || o.valor)}">${escapeHtml(o.rotulo || o.valor)}</div>`
        )
        .join('')
    : '<div class="nv-combo-vazio">Nenhuma opção encontrada.</div>';
}

// forma) — em vez disso, cada ativo ganha duas letras + uma cor sempre igual pra aquele nome.
function monogramaAtivo(nome, tamanho = 32) {

function sparkline(pontos) {
  const valores = pontos.map((p) => p.saldo);
  const min = Math.min(0, ...valores);
  const max = Math.max(0, ...valores);
  const amplitude = max - min || 1;
  const largura = 350;
  const altura = 90;
  const passo = pontos.length > 1 ? largura / (pontos.length - 1) : 0;
  const coords = pontos.map((p, i) => {
    const x = i * passo;
    const y = altura - 6 - ((p.saldo - min) / amplitude) * (altura - 16);
    return { x, y };
  });
  const linha = coords.map((c) => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(' ');
  const ultimo = coords[coords.length - 1];
  const eixo = pontos.map((p) => `<span>${MESES_ABREV[p.mes - 1]}</span>`).join('');
  return `
    <div class="nv-sparkline">
      <svg viewBox="0 0 ${largura} ${altura}" width="100%" height="${altura}" preserveAspectRatio="none" aria-hidden="true">
        <line x1="0" y1="${altura - 1}" x2="${largura}" y2="${altura - 1}" stroke="var(--nv-rule-soft)" stroke-width="1"></line>
        <polyline points="${linha}" fill="none" stroke="var(--nv-accent)" stroke-width="2"></polyline>
        <rect x="${(ultimo.x - 5).toFixed(1)}" y="${(ultimo.y - 5).toFixed(1)}" width="10" height="10" fill="var(--nv-accent)"></rect>
      </svg>
      <div class="nv-sparkline-axis">${eixo}</div>
    </div>`;
}

  const variacao = anterior ? resumo.saldo - anterior.saldo : 0;
  const categorias = L.gastosPorCategoria(state.lancamentos, ano, mes).slice(0, 3);

      <div class="nv-hero-sub">${variacao >= 0 ? '+' : '−'} ${mascarar(formatCurrency(Math.abs(variacao), idioma), ocultar)} ${I18N.t('resumo.emRelacaoA', idioma)} ${meses[(mes - 2 + 12) % 12].toLowerCase()}</div>
    </div>
    ${sparkline(historico)}
    <div class="nv-cells">

function agruparPorDia(itens) {
  const grupos = [];
  let atual = null;
  for (const item of itens) {
    if (!atual || atual.data !== item.data) {
      atual = { data: item.data, itens: [] };
      grupos.push(atual);
    }
    atual.itens.push(item);
  }
  return grupos;
}

function rotuloData(dataISO) {
  const [ano, mes, dia] = dataISO.split('-');
  return `${dia} DE ${MESES[Number(mes) - 1].toUpperCase()}`;
}

function renderCategoriaDetalhe(state, categoria, ano, mes) {
  const ocultar = !!state.ocultarValores;
  const contas = state.contas || [];
  const gastoAtual = L.gastosPorCategoria(state.lancamentos, ano, mes).find((c) => c.categoria === categoria);
  const total = gastoAtual ? gastoAtual.valor : 0;
  const historico = L.gastoCategoriaUltimosMeses(state.lancamentos, categoria, ano, mes, 6);
  const media6 = historico.reduce((s, h) => s + h.valor, 0) / (historico.length || 1);
  const variacao = media6 ? ((total - media6) / media6) * 100 : 0;
  const maiorHistorico = Math.max(1, ...historico.map((h) => h.valor));
  const meta = (state.metas || []).find((m) => m.categoria === categoria);
  const statusMeta = meta ? L.statusMeta(total, meta.limite) : null;
  const itens = L.filtrarLancamentos(state.lancamentos, ano, mes, {}).filter((l) => l.categoria === categoria && l.tipo === 'despesa');

  const barras = historico
    .map(
      (h, i) => `<div class="nv-barra-mes ${i === historico.length - 1 ? 'atual' : ''}" style="height:${Math.max(4, (h.valor / maiorHistorico) * 100)}%"></div>`
    )
    .join('');
  const eixo = historico.map((h) => `<span>${MESES_ABREV[h.mes - 1]}</span>`).join('');

  const listaItens = itens.length
    ? itens
        .map((l) => {
          const conta = contas.find((c) => c.id === l.contaId);
          const dataFmt = l.data.split('-').reverse().slice(0, 2).join('/');
          return `
        <div class="nv-item-lanc" data-id="${l.id}" data-acao="editar-lancamento">
          <div>
            <div class="nv-item-nome">${escapeHtml(l.descricao || l.categoria)}</div>
            <div class="nv-item-meta">${dataFmt}${conta ? ` · ${escapeHtml(conta.nome)}` : ''}</div>
          </div>
          <div class="nv-item-valor">${mascarar(formatNumero(L.parcelaValor(l)), ocultar)}</div>
        </div>`;
        })
        .join('')
    : '<p class="nv-vazio">Nenhum lançamento nesta categoria.</p>';

  return `
    ${headerVoltar(escapeHtml(categoria), 'fechar-categoria')}
    <div class="nv-hero" style="border-bottom:1px solid var(--nv-rule-soft)">
      <div class="nv-hero-label">GASTO EM ${MESES[mes - 1].toUpperCase()}</div>
      <div class="nv-hero-value">
        <span class="cifrao" style="font-size:18px">R$</span>
        <span class="numero" style="font-size:44px">${mascarar(formatNumero(total), ocultar)}</span>
      </div>
      <div class="nv-hero-sub" style="display:flex;gap:16px">
        <span>Média 6 meses ${mascarar(formatCurrency(media6), ocultar)}</span>
        <span style="color:${variacao >= 0 ? 'var(--nv-negative)' : 'var(--nv-positive)'}">${formatPercent(variacao)}</span>
      </div>
    </div>
    <div class="nv-barras-meses">
      <div class="nv-section-label" style="margin-bottom:14px">SEIS MESES</div>
      <div class="nv-barras-meses-grid">${barras}</div>
      <div class="nv-barras-eixo">${eixo}</div>
    </div>
    ${
      meta
        ? `<div class="nv-meta-linha">
      <div>
        <div class="nv-cell-label">META DO MÊS</div>
        <div class="nv-item-nome" style="margin-top:4px">${mascarar(formatCurrency(total), ocultar)} de ${mascarar(formatCurrency(meta.limite), ocultar)}</div>
      </div>
      <div class="nv-badge">${Math.round(statusMeta.percentual)}%</div>
    </div>`
        : ''
    }
    <div class="nv-section-head"><span class="nv-section-label">LANÇAMENTOS</span></div>
    <div>${listaItens}</div>
    ${tabBar('resumo', state.idioma)}
  `;
}

function renderMetas(state, ano, mes) {
  const ocultar = !!state.ocultarValores;
  const metas = state.metas || [];
  const gastos = L.gastosPorCategoria(state.lancamentos, ano, mes);
  const gastoPorCategoria = new Map(gastos.map((g) => [g.categoria, g.valor]));
  const totalGasto = gastos.reduce((s, g) => s + g.valor, 0);
  const totalLimite = metas.reduce((s, m) => s + m.limite, 0);
  const percentualGeral = totalLimite ? (totalGasto / totalLimite) * 100 : 0;
  const hoje = new Date();
  const ehMesAtual = hoje.getFullYear() === ano && hoje.getMonth() + 1 === mes;
  const diasNoMes = new Date(ano, mes, 0).getDate();
  const diasRestantes = ehMesAtual ? Math.max(0, diasNoMes - hoje.getDate()) : diasNoMes;

  const linhas = metas.length
    ? metas
        .map((m) => {
          const gasto = gastoPorCategoria.get(m.categoria) || 0;
          const status = L.statusMeta(gasto, m.limite);
          const pctBarra = Math.min(100, status.percentual);
          return `
        <div class="nv-meta-item ${status.excedeu ? 'excedida' : ''}" data-id="${m.id}" data-acao="editar-meta" role="button" tabindex="0">
          <div class="nv-meta-topo">
            <span>
              <span class="nv-meta-nome">${escapeHtml(m.nome || m.categoria)}</span>
              ${m.nome ? `<div class="nv-item-meta">${escapeHtml(m.categoria)}</div>` : ''}
            </span>
            <span class="nv-meta-valores ${status.excedeu ? 'excedida' : ''}">${mascarar(formatNumero(gasto), ocultar)} / ${mascarar(formatNumero(m.limite), ocultar)}</span>
          </div>
          <div class="nv-meta-track"><div class="nv-meta-fill ${status.excedeu ? 'excedida' : ''}" style="width:${pctBarra}%"></div></div>
          ${status.excedeu ? `<div class="nv-meta-excesso">Excedeu ${mascarar(formatCurrency(status.excedente), ocultar)}</div>` : ''}
        </div>`;
        })
        .join('')
    : '<p class="nv-vazio">Nenhuma meta definida ainda.</p>';

  return `
    ${headerTituloMes('Metas', ano, mes)}
    <div class="nv-orcamento">
      <div class="nv-cell-label">ORÇAMENTO USADO</div>

// Gráfico de rosca (donut) da composição da carteira por tipo de ativo — mesma paleta
// monocromática + acento já usada na barra de composição, pra manter a identidade do app (o
// resto da UI não usa nenhuma outra cor além dessas).
function renderGraficoComposicao(composicao, total, cores) {
  const raio = 52;
  const espessura = 20;
  const circunferencia = 2 * Math.PI * raio;
  let acumulado = 0;
  const segmentos = composicao
    .map((c, i) => {
      const fracao = total ? c.valor / total : 0;
      const comprimento = fracao * circunferencia;
      const dashoffset = -acumulado;
      acumulado += comprimento;
      return `<circle cx="60" cy="60" r="${raio}" fill="none" stroke="${cores[i % cores.length]}" stroke-width="${espessura}" stroke-dasharray="${comprimento.toFixed(2)} ${(circunferencia - comprimento).toFixed(2)}" stroke-dashoffset="${dashoffset.toFixed(2)}"></circle>`;
    })
    .join('');
  return `
    <svg width="120" height="120" viewBox="0 0 120 120" style="transform:rotate(-90deg);flex:none" role="img" aria-label="Gráfico de composição da carteira por tipo de ativo">
      <circle cx="60" cy="60" r="${raio}" fill="none" stroke="var(--nv-hairline)" stroke-width="${espessura}"></circle>
      ${segmentos}
    </svg>`;
}

function renderInvestimentos(state) {
  const ocultar = !!state.ocultarValores;
  const investimentos = state.investimentos || [];
  const carteira = L.totalCarteira(investimentos);

  const cores = ['var(--nv-accent)', 'var(--nv-bar-neutral-strong)', 'var(--nv-bar-neutral)', 'var(--nv-muted)', 'var(--nv-muted-2)', 'var(--nv-track)'];
  const resumos = investimentos.map((i) => ({ investimento: i, resumo: L.resumoInvestimento(i) }));
  const composicaoBruta = L.composicaoPorTipo(investimentos);
  // Mais de 6 tipos distintos vira ilegível numa pizza — os menores (já vêm ordenados do maior
  // pro menor) dobram em "Outros" em vez de gerar mais uma cor.
  const composicao =
    composicaoBruta.length > 6
      ? [...composicaoBruta.slice(0, 5), { tipo: 'outros_agrupados', valor: composicaoBruta.slice(5).reduce((s, c) => s + c.valor, 0) }]
      : composicaoBruta;
  const totalComposicao = composicao.reduce((s, c) => s + c.valor, 0) || 1;
  const sugestao = L.sugestaoAporte(investimentos, state.alocacaoAlvo).filter((s) => s.diferenca > 0);
  const hoje = new Date();
  const imposto = L.impostoEstimadoMes(investimentos, hoje.getFullYear(), hoje.getMonth() + 1);
  const agendaDividendos = L.proximosDividendosPrevistos(investimentos);

  const itens = resumos.length
    ? resumos
        .map(({ investimento: i, resumo: r }) => {
          const classe = r.rendimentoValor > 0 ? 'positivo' : r.rendimentoValor < 0 ? 'negativo' : '';
          const rotuloTipo = ROTULOS_TIPO_INVESTIMENTO[i.tipo] || i.tipo;
          return `

            <div>
              <div class="nv-item-nome">${escapeHtml(i.nome)}</div>
              <div class="nv-item-meta">${escapeHtml(rotuloTipo)} · investido ${mascarar(formatCurrency(r.valorInvestido), ocultar)}</div>
            </div>
          </div>
          <div class="nv-ativo-valor">
            <div class="nv-item-valor">${mascarar(formatCurrency(r.valorAtual), ocultar)}</div>
            <div class="nv-ativo-rend ${classe}">${formatPercent(r.rendimentoPercentual)}</div>
          </div>
        </div>`;
        })
        .join('')
    : '<p class="nv-vazio">Nenhum investimento cadastrado.</p>';

  return `
    <div class="nv-header">
      <span class="nv-title">Carteira</span>

        <span class="cifrao" style="font-size:18px">R$</span>
        <span class="numero" style="font-size:48px">${mascarar(formatNumero(carteira.totalAtual), ocultar)}</span>
      </div>
      <div class="nv-carteira-badge-row">
        <span class="nv-carteira-badge">${formatPercent(carteira.rendimentoPercentual)}</span>
        <span class="nv-item-meta">${carteira.rendimentoValor >= 0 ? '+' : '−'} ${mascarar(formatCurrency(Math.abs(carteira.rendimentoValor)), ocultar)} sobre ${mascarar(formatCurrency(carteira.totalInvestido), ocultar)}</span>
      </div>
    </div>
    ${
      investimentos.length
        ? '<button type="button" class="nv-link-accent" data-acao="abrir-perfil" style="margin:14px 0 0 20px;font-size:10px">DESCOBRIR MEU PERFIL</button>'
        : `<div class="nv-perfil-convite">
            <div class="nv-perfil-convite-titulo">Não sabe por onde começar?</div>
            <p>Responda 4 perguntas e descubra seu perfil de investidor. O app sugere uma divisão por classe de ativo pra você usar como meta.</p>
            <button type="button" class="nv-perfil-cta" data-acao="abrir-perfil">FAZER O TESTE</button>
          </div>`
    }
    ${
      composicao.length
        ? `<div class="nv-composicao">
      <div class="nv-section-label" style="margin-bottom:10px">COMPOSIÇÃO</div>
      <div class="nv-composicao-grafico">
        ${renderGraficoComposicao(composicao, totalComposicao, cores)}
        <div class="nv-composicao-legenda">
          ${composicao
            .map(
              (c, i) =>
                `<div class="nv-composicao-item"><span class="nv-composicao-bolinha" style="background:${cores[i % cores.length]}"></span>${escapeHtml(rotuloTipoInvestimento(c.tipo)).toUpperCase()} <b>${Math.round((c.valor / totalComposicao) * 100)}%</b></div>`

            .join('')}
        </div>
      </div>
      <button type="button" class="nv-link-accent" data-acao="editar-alocacao" style="margin-top:10px;font-size:10px">METAS DE ALOCAÇÃO</button>

    ${

    ${

    <div class="nv-list-plain">

    <p class="nv-item-meta" style="padding:0 20px 16px">Estimativa de apoio à decisão — não substitui o cálculo de um contador pra fins de DARF.</p>`

}

function renderAtivoDetalhe(state, ativoId) {
  const ocultar = !!state.ocultarValores;
  const investimento = (state.investimentos || []).find((i) => i.id === ativoId);
  if (!investimento) return '<p class="nv-vazio">Ativo não encontrado.</p>';

  const resumo = L.resumoInvestimento(investimento);
  const operacoes = investimento.operacoes || [];
  const proventos = investimento.proventos || [];
  const totalProventos = L.totalProventos(proventos);
  const classeRend = resumo.rendimentoValor > 0 ? 'positivo' : resumo.rendimentoValor < 0 ? 'negativo' : '';
  const dividendosPrevistos = L.proximosDividendosPrevistos([investimento]);

  const listaProventos = proventos.length
    ? [...proventos]
        .sort((a, b) => b.data.localeCompare(a.data))
        .map((p) => {
          const dataFmt = p.data.split('-').reverse().slice(0, 2).join('/');
          return `
        <div class="nv-conta-linha" data-id="${p.id}">
          <div>
            <div class="nv-item-nome">${p.tipo === 'jcp' ? 'JCP' : 'DIVIDENDO'} · ${dataFmt}</div>
          </div>
          <div style="display:flex;align-items:center;gap:10px">
            <div class="nv-item-valor">${mascarar(formatCurrency(p.valor), ocultar)}</div>
            <button type="button" class="nv-link-muted" data-acao="excluir-provento" data-id="${p.id}" aria-label="Excluir provento" style="color:var(--nv-negative)">✕</button>
          </div>
        </div>`;
        })
        .join('')
    : '<p class="nv-vazio">Nenhum provento recebido ainda.</p>';

  const listaOperacoes = operacoes.length
    ? [...operacoes]
        .sort((a, b) => b.data.localeCompare(a.data))
        .map((op) => {
          const dataFmt = op.data.split('-').reverse().slice(0, 2).join('/');
          const valorOperacao = op.quantidade * op.precoUnitario;
          return `
        <div class="nv-conta-linha" data-id="${op.id}">
          <div>
            <div class="nv-item-nome">${op.tipo === 'compra' ? 'COMPRA' : 'VENDA'} · ${dataFmt}</div>
            <div class="nv-item-meta">${formatNumero(op.quantidade)} × ${mascarar(formatCurrency(op.precoUnitario), ocultar)}</div>
          </div>
          <div style="display:flex;align-items:center;gap:10px">
            <div class="nv-item-valor">${mascarar(formatCurrency(valorOperacao), ocultar)}</div>
            <button type="button" class="nv-link-muted" data-acao="excluir-operacao" data-id="${op.id}" aria-label="Excluir operação" style="color:var(--nv-negative)">✕</button>
          </div>
        </div>`;
        })
        .join('')
    : '<p class="nv-vazio">Nenhuma operação lançada ainda.</p>';

  return `
    <div class="nv-header nv-header--back">
      <button type="button" class="nv-back" data-acao="fechar-ativo" aria-label="Voltar">${'‹'}</button>
      ${monogramaAtivo(investimento.nome, 24)}
      <span class="nv-title">${escapeHtml(investimento.nome)}</span>
      <button type="button" class="nv-gear" data-acao="editar-investimento" data-id="${investimento.id}" aria-label="Editar ativo" style="margin-left:auto">${iconGear(19)}</button>
    </div>
    <div class="nv-hero" style="border-bottom:1px solid var(--nv-rule-soft)">
      <div class="nv-hero-label">VALOR ATUAL</div>
      <div class="nv-hero-value">
        <span class="cifrao" style="font-size:18px">R$</span>
        <span class="numero" style="font-size:48px">${mascarar(formatNumero(resumo.valorAtual), ocultar)}</span>
      </div>
      <div class="nv-carteira-badge-row">
        <span class="nv-carteira-badge">${formatPercent(resumo.rendimentoPercentual)}</span>
        <span class="nv-item-meta ${classeRend}">${resumo.rendimentoValor >= 0 ? '+' : '−'} ${mascarar(formatCurrency(Math.abs(resumo.rendimentoValor)), ocultar)} sobre ${mascarar(formatCurrency(resumo.valorInvestido), ocultar)}</span>
      </div>
      ${totalProventos ? `<div class="nv-hero-sub">Proventos recebidos: ${mascarar(formatCurrency(totalProventos), ocultar)}</div>` : ''}
    </div>
    <div class="nv-cells">
      <div class="nv-cell">
        <div class="nv-cell-label">QUANTIDADE</div>
        <div class="nv-cell-valor">${mascarar(formatNumero(resumo.quantidade), ocultar)}</div>
      </div>
      <div class="nv-cell">
        <div class="nv-cell-label">PREÇO MÉDIO</div>
        <div class="nv-cell-valor">${mascarar(formatCurrency(resumo.precoMedio), ocultar)}</div>
      </div>
    </div>
    <div class="nv-section-head">
      <span class="nv-section-label">OPERAÇÕES</span>
      <button type="button" class="nv-link-accent" data-acao="nova-operacao" data-id="${investimento.id}">+ NOVA OPERAÇÃO</button>
    </div>
    <div>${listaOperacoes}</div>
    <div class="nv-section-head">
      <span class="nv-section-label">PRÓXIMOS DIVIDENDOS</span>
      <button type="button" class="nv-link-accent" data-acao="novo-provento-previsto" data-id="${investimento.id}">+ NOVO PREVISTO</button>
    </div>
    <div>${
      dividendosPrevistos.length
        ? dividendosPrevistos
            .map((p) => {
              const dataFmt = p.data.split('-').reverse().slice(0, 2).join('/');
              return `
        <div class="nv-conta-linha" data-id="${p.id}">
          <div>
            <div class="nv-item-nome">${dataFmt}${p.descricao ? ` · ${escapeHtml(p.descricao)}` : ''}</div>
          </div>
          <div style="display:flex;align-items:center;gap:10px">
            <div class="nv-item-valor">${mascarar(formatCurrency(p.valor), ocultar)}</div>
            <button type="button" class="nv-link-muted" data-acao="excluir-provento-previsto" data-id="${p.id}" aria-label="Excluir dividendo previsto" style="color:var(--nv-negative)">✕</button>
          </div>
        </div>`;
            })
            .join('')
        : '<p class="nv-vazio">Nenhum dividendo previsto cadastrado.</p>'
    }</div>
    <div class="nv-section-head">
      <span class="nv-section-label">PROVENTOS</span>
      <button type="button" class="nv-link-accent" data-acao="novo-provento" data-id="${investimento.id}">+ NOVO PROVENTO</button>
    </div>
    <div>${listaProventos}</div>
    ${tabBar('carteira', state.idioma)}
  `;
}

if (typeof module !== 'undefined' && module.exports) {

(function () {
  const logica = typeof require !== 'undefined' ? require('./logic.js') : window;
  const renderizacao = typeof require !== 'undefined' ? require('./render.js') : window;
  const { uid, applyAction, estadoInicial, hashSimples } = logica;
  const {
    renderResumo,
    renderLancamentos,
    renderNovoLancamento,
    renderCategoriaDetalhe,
    renderMetas,
    renderConfiguracoes,
    renderAbertura,
    renderInvestimentos,
    renderAtivoDetalhe,
    renderPin,
    renderCalculadoras,
  } = renderizacao;

  const CHAVE_ONBOARDING = 'nuvra-onboarding-visto';
  const CHAVE_PIN = 'nuvra-pin-hash';

  let state = estadoInicial();
  let artifactApi = null;
  let anoAtual;
  let mesAtual;
  let somenteLeitura = false;

  let abaAtual = 'resumo'; // resumo | lancamentos | carteira | metas — última aba principal visitada
  let telaAtual = 'resumo'; // aba atual + categoria | novo-lancamento | configuracoes | ativo-detalhe
  let categoriaAberta = null;
  let ativoAberto = null;
  let busca = '';
  let filtroLancamentos = 'todos';
  let contaSelecionada = null;
  let rascunhoLancamento = null; // dados em edição na tela de novo lançamento
  let descricaoSincronizacao = 'Verificando…';
  let calculadoraAtiva = 'compostos'; // compostos | simples | porcentagem | milhao
  let modoMilhao = 'tempo'; // tempo | aporte — qual variável a calculadora "primeiro milhão" resolve

  async function iniciar() {
    const hoje = new Date();
    anoAtual = hoje.getFullYear();
    mesAtual = hoje.getMonth() + 1;

    await carregarEstado();
    try {
      artifactApi = window.claude ? await window.claude.use('artifact') : null;
    } catch (erro) {
      artifactApi = null;
    }
    descricaoSincronizacao = artifactApi ? 'Ativa' : 'Indisponível neste dispositivo';
    aplicarTema(state.tema);
    inicializarCombosEstaticos();
    ligarEventos();

    if (localStorage_get(CHAVE_PIN)) {
      mostrarTelaPin();
    } else {
      prosseguirAposPin();
    }
  }

  function prosseguirAposPin() {
    if (localStorage_get(CHAVE_ONBOARDING)) {
      mostrarApp();
    } else {
      mostrarAbertura();
    }
  }

  function mostrarTelaPin(erro) {
    document.getElementById('tela-pin').hidden = false;
    document.getElementById('tela-pin').innerHTML = renderPin(erro);
    document.getElementById('tela-abertura').hidden = true;
    document.getElementById('app-shell').hidden = true;
    const campo = document.querySelector('#formulario-pin [name="pin"]');
    if (campo) campo.focus();
  }

  function localStorage_get(chave) {
    try {
      return localStorage.getItem(chave);
    } catch (erro) {
      return null;
    }
  }

  function localStorage_set(chave, valor) {
    try {
      localStorage.setItem(chave, valor);
    } catch (erro) {
      // localStorage indisponível — onboarding vai reaparecer, sem problema
    }
  }

  function mostrarAbertura() {
    document.getElementById('tela-pin').hidden = true;
    document.getElementById('tela-abertura').hidden = false;
    document.getElementById('tela-abertura').innerHTML = renderAbertura();
    document.getElementById('app-shell').hidden = true;
  }

  function mostrarApp() {
    document.getElementById('tela-pin').hidden = true;
    document.getElementById('tela-abertura').hidden = true;
    document.getElementById('app-shell').hidden = false;
    renderizarTudo();
  }

  async function carregarEstado() {
    let carregado = null;
    try {
      const resposta = await fetch('data/state.json');
      if (resposta.ok) carregado = await resposta.json();
    } catch (erro) {
      // sem dado publicado ainda, ou sem rede — segue com estado vazio/local
    }
    if (!carregado) carregado = lerBackupLocal();
    // Semente da build de demonstração (ver build-demo.js): entra por último, então quem abrir a
    // demo e mexer nos dados continua vendo as próprias alterações nas visitas seguintes. Na build
    // normal window.NUVRA_SEED não existe e esta linha não faz nada.
    if (!carregado && typeof window !== 'undefined' && window.NUVRA_SEED) carregado = window.NUVRA_SEED;
    if (carregado) state = { ...estadoInicial(), ...carregado };
  }

  function lerBackupLocal() {
    try {
      const bruto = localStorage.getItem('controle-financeiro-backup');
      return bruto ? JSON.parse(bruto) : null;
    } catch (erro) {
      return null;
    }
  }

  function salvarBackupLocal() {
    try {
      localStorage.setItem('controle-financeiro-backup', JSON.stringify(state));
    } catch (erro) {
      // localStorage indisponível — não é a fonte da verdade, pode ignorar
    }
  }

  // Campos de valor monetário (.nv-campo-moeda) são <input type="text">, não number, porque um
  // number input nunca exibe vírgula decimal (só ponto, mesmo em pt-BR) — essas duas funções
  // convertem entre o texto exibido ("1.234,56") e o número usado no resto do app.
  function numeroDoCampoMoeda(texto) {
    if (!texto) return 0;
    const numero = Number(String(texto).trim().replace(/\./g, '').replace(',', '.'));
    return Number.isFinite(numero) ? numero : 0;
  }

  function formatarCampoMoeda(elemento) {
    const bruto = elemento.value.trim();
    if (!bruto) return;
    const numero = numeroDoCampoMoeda(bruto);
    elemento.value = renderizacao.formatNumero(numero);
  }

  // Combobox custom (ver render.js renderComboSelect/renderComboBusca) — funções de apoio pra
  // abrir/fechar, selecionar item e definir valor programaticamente (prefill em modo de edição).
  function fecharTodosCombos() {
    document.querySelectorAll('.nv-combo-lista').forEach((lista) => {
      lista.hidden = true;
    });
  }

  function selecionarItemCombo(combo, valor, rotulo) {
    const inputBusca = combo.querySelector('.nv-combo-input');
    if (inputBusca) {
      inputBusca.value = valor;
      return;
    }
    definirComboPorValor(combo, valor, rotulo);
  }

  function definirComboPorValor(combo, valor, rotuloConhecido) {
    if (!combo) return;
    const oculto = combo.querySelector('input[type="hidden"]');
    if (oculto) oculto.value = valor;
    const item = combo.querySelector(`.nv-combo-item[data-valor="${(window.CSS && CSS.escape) ? CSS.escape(String(valor)) : valor}"]`);
    const rotulo = rotuloConhecido || (item ? item.dataset.rotulo : valor);
    const gatilhoValor = combo.querySelector('.nv-combo-valor');
    if (gatilhoValor) gatilhoValor.textContent = rotulo;
    combo.querySelectorAll('.nv-combo-item').forEach((it) => it.classList.toggle('ativo', it.dataset.valor === valor));
  }

  const OPCOES_TIPO_OPERACAO = [
    { valor: 'compra', rotulo: 'Compra' },
    { valor: 'venda', rotulo: 'Venda' },
  ];
  const OPCOES_TIPO_CONTA = [
    { valor: 'conta', rotulo: 'Conta corrente' },
    { valor: 'cartao', rotulo: 'Cartão' },
    { valor: 'carteira', rotulo: 'Carteira' },
  ];
  const OPCOES_TIPO_PROVENTO = [
    { valor: 'dividendo', rotulo: 'Dividendo' },
    { valor: 'jcp', rotulo: 'JCP' },
  ];
  const CATEGORIAS_META = ['Moradia', 'Alimentação', 'Transporte', 'Saúde', 'Educação', 'Lazer', 'Assinaturas', 'Vestuário', 'Outras Despesas'];

  // Combos com opções fixas (não dependem de nenhum outro campo) — populados uma única vez no
  // início. O de nome do ativo (busca) é populado de novo sempre que o tipo de ativo muda.
  function inicializarCombosEstaticos() {
    document.getElementById('combo-tipo-investimento').innerHTML = renderizacao.renderComboSelect('tipo', renderizacao.opcoesTipoInvestimento(), 'acao', 'campo-tipo-investimento');
    document.getElementById('combo-tipo-operacao').innerHTML = renderizacao.renderComboSelect('tipo', OPCOES_TIPO_OPERACAO, 'compra', 'campo-tipo-operacao');
    document.getElementById('combo-tipo-conta').innerHTML = renderizacao.renderComboSelect('tipo', OPCOES_TIPO_CONTA, 'conta', 'campo-tipo-conta');
    document.getElementById('combo-tipo-provento').innerHTML = renderizacao.renderComboSelect('tipo', OPCOES_TIPO_PROVENTO, 'dividendo', 'campo-tipo-provento');
    document.getElementById('combo-categoria-meta').innerHTML = renderizacao.renderComboSelect(
      'categoria',
      CATEGORIAS_META.map((c) => ({ valor: c, rotulo: c })),
      'Moradia',
      'campo-categoria-meta'
    );
    atualizarSugestoesAtivo('acao');

  // Repopula o combo de busca de nome/ticker de acordo com o tipo de ativo escolhido — é só um
  // ponto de partida (lista fixa embutida no app, sem cotação nenhuma); o campo continua
  // aceitando qualquer texto digitado que não esteja na lista.
  function atualizarSugestoesAtivo(tipo) {
    const container = document.getElementById('combo-nome-ativo');
    if (!container) return;
    const inputAnterior = container.querySelector('.nv-combo-input');
    const valorAtual = inputAnterior ? inputAnterior.value : '';
    container.innerHTML = renderizacao.renderComboBusca('nome', valorAtual, logica.listaSugeridaPorTipo(tipo), 'campo-nome-ativo');
    // Reaplica o filtro do que já tinha sido digitado em cima da lista nova (a lista em si vem
    // fechada por padrão — só isso já evita mostrar sugestões de um tipo antigo se a pessoa
    // reabrir o campo depois de trocar o tipo).
    if (valorAtual) filtrarComboBusca(container, valorAtual);
  }

  // Esconde/mostra os itens de um combo de busca conforme o texto digitado, e mostra a
  // mensagem de "nenhuma sugestão" quando o filtro não bate com nada da lista.
  function filtrarComboBusca(combo, textoDigitado) {
    const lista = combo.querySelector('.nv-combo-lista');
    const termo = textoDigitado.trim().toUpperCase();
    let algumVisivel = false;
    lista.querySelectorAll('.nv-combo-item').forEach((item) => {
      const visivel = !termo || item.dataset.valor.toUpperCase().includes(termo);
      item.hidden = !visivel;
      if (visivel) algumVisivel = true;
    });
    const vazio = lista.querySelector('.nv-combo-vazio');
    if (vazio) vazio.hidden = algumVisivel;
  }

  // Lê um campo numérico em texto no padrão pt-BR (vírgula decimal) — mesma regra de
  // numeroDoCampoMoeda, reaproveitada aqui pros campos de taxa/percentual da calculadora, que não
  // são .nv-campo-moeda (não fazem sentido com formatação de milhar tipo "1.234,56").
  function numeroPtBR(elemento) {
    return elemento ? numeroDoCampoMoeda(elemento.value) : 0;
  }

  // Campos de taxa/percentual (não são .nv-campo-moeda) usam um parser mais tolerante: aceita
  // ponto OU vírgula como decimal, porque o teclado numérico de celular normalmente digita ponto —
  // com numeroPtBR (que trata ponto como separador de milhar), digitar "1.5" virava 15 em silêncio.
  function numeroTaxa(elemento) {
    return elemento ? logica.numeroDecimalFlexivel(elemento.value) : 0;
  }

  function mostrarResultadoCalculadora(idResultado, linhasHtml) {
    const resultado = document.getElementById(idResultado);
    resultado.hidden = false;
    resultado.innerHTML = linhasHtml;
  }

  // Escapa mesmo só recebendo rótulo fixo e número formatado hoje: o retorno vai direto pro
  // innerHTML em mostrarResultadoCalculadora, então no dia em que alguém passar texto digitado
  // pelo usuário (o nome de uma meta, por exemplo) isso viraria XSS sem ninguém perceber.
  function linhaResultado(rotulo, valor) {
    const esc = renderizacao.escapeHtml;
    return `<div class="nv-row-plain"><span>${esc(rotulo)}</span><span>${esc(valor)}</span></div>`;
  }

      taxaMensal: numeroTaxa(document.getElementById('campo-calc-compostos-taxa')) / 100,
      meses: Number(document.getElementById('campo-calc-compostos-meses').value) || 0,
    });
    mostrarResultadoCalculadora(
      'resultado-calc-compostos',
      linhaResultado('Montante final', renderizacao.formatCurrency(r.montanteFinal)) +
        linhaResultado('Total investido', renderizacao.formatCurrency(r.totalInvestido)) +
        linhaResultado('Total em juros', renderizacao.formatCurrency(r.totalJuros))
    );
