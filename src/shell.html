<title>Nuvra</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --nv-radius-control:12px;--nv-radius-avatar:16px;--nv-radius-stepper:9px;--nv-radius-badge:8px;--nv-radius-pill:999px;
  --nv-bg:#f3f2f2;--nv-fg:#201e1d;--nv-fg-inverse:#fff;--nv-accent:#ec3013;--nv-on-accent:#fff;
  --nv-positive:#12854e;--nv-negative:#ec3013;--nv-negative-soft:#ec3013;
  --nv-muted:rgba(32,30,29,.55);--nv-muted-2:rgba(32,30,29,.5);
  --nv-rule-strong:#201e1d;--nv-rule-soft:rgba(32,30,29,.16);--nv-hairline:rgba(32,30,29,.14);
  --nv-track:rgba(32,30,29,.14);--nv-bar-neutral:rgba(32,30,29,.2);--nv-bar-neutral-strong:#201e1d;
  --nv-group-bg:rgba(32,30,29,.05);--nv-alert-bg:rgba(236,48,19,.06);
  /* Dois níveis de superfície: o "chão" da tela e o cartão que se levanta dele. Sem essa
     separação tudo divide o mesmo plano e a tela lê como página, não como app. */
  --nv-chao:#eceae7;--nv-surface:#fff;--nv-surface-2:#f6f5f3;
  --nv-surface-borda:rgba(32,30,29,.07);
  --nv-sombra:0 1px 2px rgba(32,30,29,.04),0 10px 24px -14px rgba(32,30,29,.22);
  --nv-raio-cartao:20px;--nv-raio-interno:14px;
  /* Tinta de fundo para estado (dia positivo, meta estourada, alerta crítico): a cor do texto
     sozinha não marca uma célula de calendário, e borda dura foi o que fez a tela parecer papel. */
  --nv-tint-pos:rgba(18,133,78,.10);--nv-tint-neg:rgba(236,48,19,.09);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --nv-bg:#201e1d;--nv-fg:#f3f2f2;--nv-fg-inverse:#201e1d;
    --nv-positive:#7fd6a3;--nv-negative:#ff6a4d;--nv-negative-soft:#ff8f78;
    --nv-muted:rgba(243,242,242,.55);--nv-muted-2:rgba(243,242,242,.5);
    --nv-rule-strong:rgba(243,242,242,.3);--nv-rule-soft:rgba(243,242,242,.2);--nv-hairline:rgba(243,242,242,.14);
    --nv-track:rgba(243,242,242,.18);--nv-bar-neutral:rgba(243,242,242,.28);--nv-bar-neutral-strong:rgba(243,242,242,.8);
    --nv-group-bg:rgba(243,242,242,.06);--nv-alert-bg:rgba(236,48,19,.14);
    /* No escuro a sombra não se lê: quem separa o cartão do chão é o próprio contraste entre as
       duas superfícies, apoiado por uma borda de um pixel. */
    --nv-chao:#141212;--nv-surface:#211f1e;--nv-surface-2:#2a2726;
    --nv-surface-borda:rgba(243,242,242,.07);
    --nv-sombra:0 1px 2px rgba(0,0,0,.35);
    --nv-tint-pos:rgba(127,214,163,.13);--nv-tint-neg:rgba(255,106,77,.13);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --nv-bg:#201e1d;--nv-fg:#f3f2f2;--nv-fg-inverse:#201e1d;
  --nv-positive:#7fd6a3;--nv-negative:#ff6a4d;--nv-negative-soft:#ff8f78;
  --nv-muted:rgba(243,242,242,.55);--nv-muted-2:rgba(243,242,242,.5);
  --nv-rule-strong:rgba(243,242,242,.3);--nv-rule-soft:rgba(243,242,242,.2);--nv-hairline:rgba(243,242,242,.14);
  --nv-track:rgba(243,242,242,.18);--nv-bar-neutral:rgba(243,242,242,.28);--nv-bar-neutral-strong:rgba(243,242,242,.8);
  --nv-group-bg:rgba(243,242,242,.06);--nv-alert-bg:rgba(236,48,19,.14);
  --nv-chao:#141212;--nv-surface:#211f1e;--nv-surface-2:#2a2726;
  --nv-surface-borda:rgba(243,242,242,.07);
  --nv-sombra:0 1px 2px rgba(0,0,0,.35);
  --nv-tint-pos:rgba(127,214,163,.13);--nv-tint-neg:rgba(255,106,77,.13);
}
*{box-sizing:border-box;}
html,body{margin:0;}
/* O [hidden] do navegador tem especificidade mínima e perde pra qualquer regra do app que defina
   display (ex.: "dialog label{display:flex}"), então esconder um campo por JS não fazia efeito.
   Com !important, marcar hidden esconde de verdade em qualquer lugar. */
[hidden]{display:none !important;}
body{background:var(--nv-bg);color:var(--nv-fg);font-family:Archivo,system-ui,-apple-system,"Segoe UI",sans-serif;}
button,input,select{font-family:inherit;}
/* color-scheme (declarado no :root acima) nem sempre é suficiente pro popup nativo do <select> —
   alguns navegadores (Chrome no Windows, em particular) só respeitam o tema escuro no popup
   quando as <option> também têm cor explícita, não herdada. */
select option{background-color:var(--nv-bg);color:var(--nv-fg);}
:focus-visible{outline:2px solid var(--nv-accent);outline-offset:2px;}
:focus:not(:focus-visible){outline:none;}

.nv-tela{display:flex;flex-direction:column;min-height:100dvh;max-width:480px;margin:0 auto;}
.nv-tela[hidden]{display:none;}

/* ---- Sistema de cartões ----
   A tela vira um "chão" onde os cartões se apoiam. O que separa um bloco do outro é o espaço
   entre eles, não uma régua — por isso os cartões não têm borda dura entre seções. */
.nv-tela--cartoes{background:var(--nv-chao);}
.nv-pilha{display:flex;flex-direction:column;gap:12px;padding:12px 14px 22px;flex:1;}
.nv-cartao{overflow:hidden;background:var(--nv-surface);border:1px solid var(--nv-surface-borda);border-radius:var(--nv-raio-cartao);box-shadow:var(--nv-sombra);padding:18px;}
.nv-cartao--justo{padding:14px 16px;}
.nv-cartao--limpo{padding:0;overflow:hidden;}
.nv-cartao-topo{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px;}
.nv-cartao-titulo{font-size:11px;font-weight:600;letter-spacing:.12em;color:var(--nv-muted);text-transform:uppercase;}
.nv-dupla{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

/* Cartão do saldo: o número do mês e a trajetória dele são uma coisa só, não dois blocos. */
.nv-saldo-valor{display:flex;align-items:baseline;gap:7px;margin-top:9px;}
.nv-saldo-valor .cifrao{font-size:19px;font-weight:600;color:var(--nv-muted);}
.nv-saldo-valor .numero{font-size:44px;font-weight:600;letter-spacing:-.035em;line-height:.95;font-variant-numeric:tabular-nums;}
.nv-saldo-sub{margin-top:9px;font-size:12px;font-weight:600;color:var(--nv-muted);display:flex;align-items:center;gap:6px;}
.nv-saldo-onda{margin:16px -18px -18px;display:block;width:calc(100% + 36px);}

/* Cartão de número curto (entrou / saiu / carteira) */
.nv-num-rotulo{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--nv-muted);display:flex;align-items:center;gap:6px;}
.nv-num-valor{font-size:21px;font-weight:600;margin-top:7px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.nv-num-valor.positivo{color:var(--nv-positive);}
.nv-num-valor.negativo{color:var(--nv-negative);}
.nv-ponto{width:7px;height:7px;border-radius:50%;flex:none;}

/* Linha de conteúdo dentro de cartão: separador leve, e o último sem separador nenhum. */
.nv-linha{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--nv-surface-borda);}
.nv-linha:last-child{border-bottom:none;padding-bottom:0;}
.nv-linha:first-child{padding-top:0;}
.nv-linha-botao{width:100%;background:none;border:none;font:inherit;color:inherit;text-align:left;cursor:pointer;}
.nv-linha-nome{font-size:14px;font-weight:600;}
.nv-linha-meta{font-size:11.5px;color:var(--nv-muted);margin-top:3px;}
.nv-linha-valor{font-size:14.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;}

/* Barra de abas: ícone em cima, nome por extenso embaixo. */
.nv-tabbar--icones{display:flex;background:var(--nv-surface);border-top:1px solid var(--nv-surface-borda);padding:6px 2px calc(6px + env(safe-area-inset-bottom,0px));position:sticky;bottom:0;}
.nv-tabbar--icones button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;background:none;border:none;cursor:pointer;font-family:inherit;color:var(--nv-muted-2);}
.nv-tabbar--icones button span{font-size:9.5px;font-weight:600;letter-spacing:.01em;white-space:nowrap;}
.nv-tabbar--icones button svg{flex:none;}
.nv-tabbar--icones button.ativo{color:var(--nv-accent);}

.nv-header{padding:14px 20px 12px;border-bottom:1px solid var(--nv-surface-borda);display:flex;align-items:center;justify-content:space-between;gap:12px;}
.nv-header--back{justify-content:flex-start;gap:12px;}
.nv-brand{display:flex;align-items:center;gap:9px;}
.nv-wordmark{font-size:16px;font-weight:600;letter-spacing:.2em;}
.nv-monthnav{display:flex;align-items:center;gap:10px;}
.nv-monthnav button{background:none;border:none;color:var(--nv-accent);font-size:20px;line-height:1;cursor:pointer;padding:4px;}
.nv-monthnav span{font-size:13px;font-weight:600;letter-spacing:.1em;color:var(--nv-muted);white-space:nowrap;}
.nv-gear{background:none;border:none;color:var(--nv-muted);cursor:pointer;padding:4px;line-height:1;display:inline-flex;align-items:center;}
.nv-title{font-size:22px;font-weight:600;letter-spacing:-.02em;}
.nv-month-label{font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--nv-muted);}
.nv-back{background:none;border:none;color:var(--nv-accent);font-size:20px;line-height:1;cursor:pointer;padding:0;}
.nv-link-muted{font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--nv-muted);background:none;border:none;cursor:pointer;padding:0;}
.nv-link-accent{font-size:10px;font-weight:600;letter-spacing:.08em;color:var(--nv-accent);background:none;border:none;cursor:pointer;padding:0;}




/* Patrimonio liquido */
.nv-patrimonio{padding:18px 20px;border-top:1px solid var(--nv-rule-soft);}
.nv-patrimonio-valor{font-size:32px;font-weight:600;letter-spacing:-.02em;margin:6px 0 4px;font-variant-numeric:tabular-nums;}
.nv-patrimonio-valor.nv-negativo{color:var(--nv-accent);}

/* Calendario financeiro */
.nv-calendario{padding:16px 20px 24px;}
.nv-dias-semana{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:8px;}
.nv-dias-semana span{text-align:center;font-size:10px;font-weight:600;letter-spacing:.1em;color:var(--nv-muted);}
.nv-grade{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.nv-dia{aspect-ratio:1;border:1px solid var(--nv-rule-soft);border-radius:8px;background:none;color:inherit;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:2px;cursor:default;}
.nv-dia-vazio{border:none;}
.nv-dia-numero{font-size:11px;font-weight:600;color:var(--nv-muted);}
.nv-dia-valor{font-size:9px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;}
button.nv-dia{cursor:pointer;}
.nv-dia-positivo{border-color:rgba(92,201,138,.45);background:rgba(92,201,138,.10);}
.nv-dia-positivo .nv-dia-numero,.nv-dia-positivo .nv-dia-valor{color:var(--nv-positive,#5cc98a);}
.nv-dia-negativo{border-color:rgba(230,64,42,.45);background:rgba(230,64,42,.10);}
.nv-dia-negativo .nv-dia-numero,.nv-dia-negativo .nv-dia-valor{color:var(--nv-accent);}
.nv-calendario-rodape{display:flex;justify-content:space-between;align-items:baseline;margin-top:18px;padding-top:14px;border-top:1px solid var(--nv-rule-soft);font-weight:600;}
.nv-positivo{color:var(--nv-positive,#5cc98a);}
.nv-negativo{color:var(--nv-accent);}

/* Entrada rapida por texto */
.nv-entrada-rapida{display:flex;gap:8px;padding:14px 20px 0;margin:0;}
.nv-entrada-rapida input{flex:1;background:var(--nv-surface,rgba(255,255,255,.04));border:1px solid var(--nv-rule-soft);border-radius:999px;padding:12px 16px;color:inherit;font-family:inherit;font-size:14px;outline:none;}
.nv-entrada-rapida-ok{flex:none;width:44px;border:none;border-radius:999px;background:var(--nv-accent);color:#17140f;font-size:22px;font-weight:600;cursor:pointer;line-height:1;}
.nv-entrada-rapida-dica{padding:8px 20px 0;margin:0;font-size:11px;color:var(--nv-muted);}

/* Teste de perfil de investidor */
.nv-perfil-convite{margin:16px 20px 0;padding:18px;border:1px solid var(--nv-rule-soft);border-radius:14px;}
.nv-perfil-convite-titulo{font-size:15px;font-weight:600;margin-bottom:6px;}
.nv-perfil-convite p{font-size:12px;color:var(--nv-muted);line-height:1.5;margin:0 0 14px;}
.nv-perfil-cta{font-size:10px;font-weight:600;letter-spacing:.1em;color:var(--nv-bg);background:var(--nv-accent);border:none;border-radius:999px;padding:10px 18px;cursor:pointer;}
/* Uma pergunta por tela: a opção é o alvo de toque, não um rádio de 13px ao lado de um texto. */
.nv-perfil-progresso{display:flex;flex-direction:column;gap:9px;padding:4px 4px 0;}
.nv-perfil-progresso span{font-size:10.5px;font-weight:600;letter-spacing:.12em;color:var(--nv-muted);}
.nv-perfil-barra{height:5px;border-radius:var(--nv-radius-pill);background:var(--nv-track);overflow:hidden;}
.nv-perfil-barra i{display:block;height:100%;border-radius:var(--nv-radius-pill);background:var(--nv-accent);transition:width .25s ease;}
.nv-perfil-pergunta{font-size:22px;font-weight:600;line-height:1.28;letter-spacing:-.02em;margin:0;}
.nv-perfil-opcoes{display:flex;flex-direction:column;gap:9px;}
.nv-opcao{display:flex;align-items:center;gap:13px;width:100%;text-align:left;font:inherit;font-size:14px;line-height:1.35;color:inherit;cursor:pointer;background:var(--nv-surface);border:1px solid var(--nv-surface-borda);border-radius:var(--nv-raio-interno);box-shadow:var(--nv-sombra);padding:16px;}
.nv-opcao-marca{width:20px;height:20px;border-radius:50%;border:2px solid var(--nv-rule-soft);flex:none;}
.nv-opcao.escolhida{border-color:var(--nv-accent);background:var(--nv-alert-bg);}
.nv-opcao.escolhida .nv-opcao-marca{border-color:var(--nv-accent);background:var(--nv-accent);box-shadow:inset 0 0 0 3px var(--nv-surface);}

/* Tela de cálculo entre a última resposta e o resultado. */
.nv-perfil-calculando{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:40px 32px;text-align:center;}
.nv-perfil-calculando-titulo{font-size:19px;font-weight:600;letter-spacing:-.01em;}
.nv-perfil-calculando-texto{font-size:13px;color:var(--nv-muted);line-height:1.5;margin:8px 0 0;max-width:260px;}
.nv-perfil-carregando-barra{width:180px;height:5px;border-radius:var(--nv-radius-pill);background:var(--nv-track);overflow:hidden;}
.nv-perfil-carregando-barra i{display:block;width:40%;height:100%;border-radius:var(--nv-radius-pill);background:var(--nv-accent);animation:nv-desliza 1.05s ease-in-out infinite;}
@keyframes nv-desliza{from{transform:translateX(-110%);}to{transform:translateX(360%);}}
/* Quem pediu menos movimento no sistema recebe a barra parada, não uma barra correndo. */
@media (prefers-reduced-motion: reduce){
  .nv-perfil-carregando-barra i{animation:none;width:100%;}
  .nv-perfil-barra i{transition:none;}
}

.nv-perfil-resultado-nome{font-size:32px;font-weight:600;letter-spacing:-.025em;margin-top:8px;}
.nv-perfil-pontos{font-size:11.5px;color:var(--nv-muted);margin-top:5px;}
.nv-perfil-escala{height:5px;border-radius:var(--nv-radius-pill);background:var(--nv-track);overflow:hidden;margin-top:14px;}
.nv-perfil-escala i{display:block;height:100%;border-radius:var(--nv-radius-pill);background:var(--nv-accent);}
.nv-perfil-resumo{font-size:13px;color:var(--nv-muted);line-height:1.5;margin:14px 0 0;}
.nv-perfil-aviso{font-size:11px;line-height:1.55;color:var(--nv-muted);margin:0;}

.nv-cells{display:flex;border-bottom:1px solid var(--nv-rule-soft);}
.nv-cell{flex:1;padding:14px 20px;}
.nv-cell+.nv-cell{border-left:1px solid var(--nv-rule-soft);}
.nv-cell-label{font-size:10px;font-weight:600;letter-spacing:.12em;color:var(--nv-muted);}
.nv-cell-valor{font-size:17px;font-weight:600;margin-top:5px;font-variant-numeric:tabular-nums;}
.nv-select-inline{margin-top:3px;font-size:12px;font-weight:600;background:none;border:none;color:inherit;padding:0;width:100%;}

/* .nv-label: rótulo de seção solto (rodapé do calendário, patrimônio líquido, resultado do perfil). */
.nv-label{font-size:10px;font-weight:600;letter-spacing:.14em;color:var(--nv-muted);}

/* Linha de item sem clique — mesma medida da linha de lançamento, sem o cursor de ponteiro.
   Também estava sem regra: no detalhe do dia o nome colava na régua de cima e o valor caía
   embaixo, em vez de ficar alinhado à direita. */
.nv-item{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:15px 20px;border-bottom:1px solid var(--nv-hairline);}
.nv-item .nv-item-nome{font-size:14.5px;line-height:1.25;}
.nv-item .nv-item-valor{font-size:15.5px;white-space:nowrap;}
.nv-item .nv-item-meta{margin-top:3px;}
.nv-bars{padding:0 20px 4px;display:flex;flex-direction:column;gap:11px;}
.nv-bar-row{display:flex;flex-direction:column;gap:5px;background:none;border:none;text-align:left;padding:0;font:inherit;color:inherit;cursor:pointer;width:100%;}
.nv-bar-top{display:flex;justify-content:space-between;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;}
.nv-bar-track{height:6px;border-radius:var(--nv-radius-pill);background:var(--nv-track);}
.nv-bar-fill{height:6px;border-radius:var(--nv-radius-pill);}

/* Alertas por regra: crítico usa o acento da marca; atenção fica no cinza neutro, pra que só o
   que já estourou puxe o olho. Sem cor nova — a paleta do app é monocromática + acento. */
.nv-alertas{padding:0 20px 4px;display:flex;flex-direction:column;gap:8px;}
.nv-alerta{padding:11px 13px;border-radius:var(--nv-radius-control);border-left:3px solid var(--nv-bar-neutral);background:var(--nv-group-bg);}
.nv-alerta--critico{border-left-color:var(--nv-accent);background:var(--nv-alert-bg);}
.nv-alerta-titulo{font-size:12.5px;font-weight:600;line-height:1.3;}
.nv-alerta--critico .nv-alerta-titulo{color:var(--nv-negative);}
.nv-alerta-detalhe{font-size:11.5px;color:var(--nv-muted);margin-top:3px;line-height:1.4;}

.nv-list-plain{padding:0 20px 8px;}
.nv-row-plain{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--nv-hairline);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;}
.nv-row-plain:last-child{border-bottom:none;}
.nv-row-plain small{color:var(--nv-muted-2);font-weight:600;margin-left:4px;}

.nv-vazio{color:var(--nv-muted);text-align:center;padding:16px 20px;font-size:.9rem;}


.nv-chips{display:flex;gap:6px;padding:12px 20px;overflow-x:auto;}
.nv-chip{font-size:10px;font-weight:600;letter-spacing:.1em;padding:6px 12px;border-radius:var(--nv-radius-pill);border:1px solid var(--nv-rule-soft);background:none;color:inherit;cursor:pointer;white-space:nowrap;font-family:inherit;}
.nv-chip.ativo{background:var(--nv-accent);border-color:var(--nv-accent);color:var(--nv-on-accent);}

.nv-item-lanc{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:1px solid var(--nv-hairline);cursor:pointer;background:none;width:100%;text-align:left;border-left:none;border-right:none;border-top:none;font-family:inherit;color:inherit;}
.nv-item-nome{font-size:13px;font-weight:600;}
.nv-item-meta{font-size:11px;color:var(--nv-muted-2);margin-top:2px;}
.nv-item-valor{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;}
.nv-item-valor.positivo{color:var(--nv-positive);}
.nv-item-valor.negativo{color:var(--nv-negative);}
.nv-tag-parcela{font-size:9px;font-weight:600;letter-spacing:.04em;border:1px solid var(--nv-rule-soft);padding:1px 5px;border-radius:var(--nv-radius-pill);margin-left:6px;color:var(--nv-muted);}

.nv-acao-fixa{padding:14px 20px;}
.nv-btn-cheio{background:var(--nv-accent);color:var(--nv-on-accent);padding:14px 18px;border-radius:var(--nv-radius-control);display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;letter-spacing:.12em;border:none;cursor:pointer;width:100%;font-family:inherit;}
.nv-btn-contorno{border:2px solid var(--nv-rule-strong);border-radius:var(--nv-radius-control);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;letter-spacing:.12em;background:none;color:inherit;cursor:pointer;width:100%;font-family:inherit;}
.nv-btn-cheio .mais,.nv-btn-contorno .mais{font-size:18px;line-height:1;}
.nv-btn-contorno .mais{color:var(--nv-accent);}

.nv-segmentado{display:flex;border-bottom:2px solid var(--nv-rule-strong);}
.nv-segmentado button{flex:1;padding:11px 0;text-align:center;font-size:11px;font-weight:600;letter-spacing:.1em;background:none;border:none;cursor:pointer;color:inherit;font-family:inherit;border-left:1px solid var(--nv-rule-soft);}
.nv-segmentado button:first-child{border-left:none;}
.nv-segmentado button.ativo{background:var(--nv-accent);color:var(--nv-on-accent);}

.nv-campo-linha{padding:12px 20px;border-bottom:1px solid var(--nv-rule-soft);display:flex;flex-direction:column;}
.nv-campo-label{font-size:9px;font-weight:600;letter-spacing:.14em;color:var(--nv-muted);}

/* Combobox custom — substitui <select>/<datalist> nativos, cuja aparência de popup (fundo,
   cor de item selecionado) o navegador não deixa a página controlar de forma confiável. */
.nv-combo{position:relative;}
.nv-combo-gatilho{background:none;border:none;color:inherit;font:inherit;padding:0;outline:none;cursor:pointer;width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.nv-combo-gatilho .nv-combo-seta{flex:none;color:var(--nv-muted);}
.nv-combo-input{font-size:15px;font-weight:500;background:none;border:none;color:inherit;width:100%;font-family:inherit;padding:0;outline:none;}
/* Dentro de um dialog (Investimento, Operação, Conta, Provento, Meta) o combo precisa da mesma
   caixa com borda dos outros campos (dialog input) e de espaço embaixo — sem isso, o rótulo
   seguinte fica colado na caixa e tudo parece uma coisa só, difícil de tocar certo. */
dialog .nv-combo{margin-bottom:14px;}
dialog .nv-combo-gatilho,
dialog .nv-combo-input{font-family:inherit;font-size:1rem;padding:8px;border-radius:8px;border:1px solid var(--nv-rule-soft);background:var(--nv-bg);color:var(--nv-fg);}
.nv-combo-lista{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--nv-bg);border:1px solid var(--nv-rule-soft);border-radius:var(--nv-radius-control);max-height:240px;overflow-y:auto;z-index:30;box-shadow:0 10px 28px rgba(0,0,0,.4);}
.nv-combo-lista[hidden]{display:none;}
.nv-combo-item{padding:11px 14px;font-size:14px;font-weight:500;cursor:pointer;}
.nv-combo-item:hover,.nv-combo-item.ativo{background:var(--nv-accent);color:var(--nv-on-accent);}
.nv-combo-item[hidden]{display:none;}
.nv-combo-vazio{padding:11px 14px;font-size:12px;color:var(--nv-muted);}
.nv-campo-linha input,.nv-campo-linha select{font-size:15px;font-weight:500;margin-top:4px;background:none;border:none;color:inherit;width:100%;font-family:inherit;padding:0;outline:none;}
.nv-campo-dupla{display:flex;border-bottom:1px solid var(--nv-rule-soft);}
.nv-campo-dupla>div{flex:1;padding:12px 20px;display:flex;flex-direction:column;}
.nv-campo-dupla>div:first-child{border-right:1px solid var(--nv-rule-soft);}
.nv-campo-dupla input,.nv-campo-dupla select{font-size:15px;font-weight:500;margin-top:4px;background:none;border:none;color:inherit;width:100%;font-family:inherit;padding:0;outline:none;}

.nv-linha-toggle{padding:14px 20px;border-bottom:1px solid var(--nv-rule-soft);display:flex;justify-content:space-between;align-items:center;}
.nv-stepper-linha.desabilitado{opacity:.4;pointer-events:none;}
.nv-switch-wrap{position:relative;display:inline-flex;cursor:pointer;}
.nv-switch-wrap input{position:absolute;opacity:0;width:44px;height:24px;margin:0;cursor:pointer;}
.nv-switch{width:44px;height:24px;border:2px solid var(--nv-muted);border-radius:var(--nv-radius-pill);display:flex;align-items:center;padding:2px;}
.nv-switch .knob{width:16px;height:16px;border-radius:var(--nv-radius-pill);background:var(--nv-muted);transition:transform .15s ease,background .15s ease;}
.nv-switch-wrap input:checked+.nv-switch{border-color:var(--nv-accent);}
.nv-switch-wrap input:checked+.nv-switch .knob{transform:translateX(20px);background:var(--nv-accent);}
.nv-stepper{display:flex;align-items:center;}
.nv-stepper button{width:30px;height:30px;border:1px solid var(--nv-muted);border-radius:var(--nv-radius-stepper);background:none;color:inherit;font-size:15px;cursor:pointer;font-family:inherit;}
.nv-stepper span{width:40px;height:30px;border-top:1px solid var(--nv-muted);border-bottom:1px solid var(--nv-muted);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;}
.nv-rodape-form{margin-top:auto;padding:16px 20px 20px;display:flex;flex-direction:column;gap:10px;}
.nv-rodape-saldo{border-top:2px solid var(--nv-rule-strong);padding-top:14px;display:flex;justify-content:space-between;font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--nv-muted);}
.nv-rodape-saldo span:last-child{color:var(--nv-fg);font-variant-numeric:tabular-nums;}

.nv-barras-meses{padding:18px 20px 14px;border-bottom:1px solid var(--nv-rule-soft);}
.nv-barras-meses-grid{display:flex;align-items:flex-end;gap:10px;height:120px;border-bottom:2px solid var(--nv-rule-strong);}
.nv-barra-mes{flex:1;border-radius:5px 5px 0 0;background:var(--nv-bar-neutral);}
.nv-barra-mes.atual{background:var(--nv-accent);}
.nv-barras-eixo{display:flex;gap:10px;margin-top:8px;font-size:9px;font-weight:600;letter-spacing:.1em;color:var(--nv-muted);}
.nv-barras-eixo span{flex:1;text-align:center;}
.nv-meta-linha{padding:14px 20px;border-bottom:1px solid var(--nv-rule-soft);display:flex;justify-content:space-between;align-items:center;}
.nv-badge{font-size:12px;font-weight:600;padding:4px 9px;border-radius:var(--nv-radius-badge);background:var(--nv-fg);color:var(--nv-bg);}

.nv-orcamento{padding:22px 20px 18px;border-bottom:2px solid var(--nv-rule-strong);}
.nv-orcamento-num{display:flex;align-items:baseline;gap:8px;margin-top:8px;flex-wrap:wrap;}
.nv-orcamento-num .grande{font-size:46px;font-weight:600;letter-spacing:-.03em;line-height:.9;font-variant-numeric:tabular-nums;}
.nv-orcamento-num .pct{font-size:22px;font-weight:600;}
.nv-orcamento-num .detalhe{font-size:12px;font-weight:600;color:var(--nv-muted);margin-left:6px;}
.nv-orcamento-track{height:8px;border-radius:var(--nv-radius-pill);background:var(--nv-track);margin-top:14px;}
.nv-orcamento-fill{height:8px;border-radius:var(--nv-radius-pill);background:var(--nv-fg);}
.nv-orcamento-sub{margin-top:8px;font-size:11px;font-weight:600;color:var(--nv-muted);}
.nv-meta-topo{display:flex;justify-content:space-between;align-items:baseline;}
.nv-meta-nome{font-size:14px;font-weight:600;}
.nv-meta-valores{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;}
.nv-meta-valores.excedida{color:var(--nv-negative-soft);}
.nv-meta-track{height:6px;border-radius:var(--nv-radius-pill);background:var(--nv-track);margin-top:9px;}
.nv-meta-fill{height:6px;border-radius:var(--nv-radius-pill);background:var(--nv-fg);}
.nv-meta-fill.excedida{background:var(--nv-accent);}
.nv-meta-excesso{margin-top:8px;font-size:11px;font-weight:600;color:var(--nv-negative-soft);}

.nv-perfil{padding:18px 20px;border-bottom:2px solid var(--nv-rule-strong);display:flex;align-items:center;gap:14px;}
.nv-avatar{width:52px;height:52px;border-radius:var(--nv-radius-avatar);background:var(--nv-fg);color:var(--nv-bg);display:flex;align-items:center;justify-content:center;}
.nv-perfil-nome{font-size:16px;font-weight:600;}
.nv-perfil-sub{font-size:11px;color:var(--nv-muted);margin-top:3px;}
.nv-segmentado-tema{display:flex;border:2px solid var(--nv-muted);border-radius:var(--nv-radius-control);overflow:hidden;}
.nv-segmentado-tema button{flex:1;padding:10px 0;text-align:center;font-size:11px;font-weight:600;letter-spacing:.1em;background:none;border:none;cursor:pointer;color:inherit;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;}
.nv-segmentado-tema button.ativo{background:var(--nv-fg);color:var(--nv-bg);}
.nv-conta-linha{display:flex;justify-content:space-between;align-items:center;padding:11px 20px;border-bottom:1px solid var(--nv-hairline);}
.nv-conta-marcador{width:30px;height:30px;border-radius:var(--nv-radius-stepper);border:1px dashed var(--nv-muted-2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--nv-muted);}
.nv-monograma{border-radius:50%;color:#f3f2f2;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none;letter-spacing:-.02em;}
.nv-dado-linha{display:flex;justify-content:space-between;align-items:center;padding:13px 20px;border-bottom:1px solid var(--nv-hairline);}
.nv-rodape-versao{margin-top:auto;padding:16px 20px;font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--nv-muted-2);}

.nv-abertura{display:flex;flex-direction:column;min-height:100dvh;max-width:480px;margin:0 auto;background:#201e1d;color:#f3f2f2;padding:56px 24px 28px;}
.nv-abertura-frase{margin-top:16px;border-top:2px solid rgba(243,242,242,.45);padding-top:16px;font-size:15px;font-weight:500;line-height:1.45;max-width:280px;color:rgba(243,242,242,.85);}
.nv-abertura-progress{display:flex;gap:6px;margin-bottom:24px;}
.nv-abertura-progress span{width:26px;height:3px;background:rgba(243,242,242,.3);}
.nv-abertura-progress span.ativo{background:var(--nv-accent);}
.nv-abertura-cta{background:var(--nv-accent);color:#fff;padding:16px 18px;border-radius:var(--nv-radius-control);font-size:12px;font-weight:600;letter-spacing:.14em;text-align:center;border:none;cursor:pointer;width:100%;font-family:inherit;}

.nv-carteira-badge-row{margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.nv-carteira-badge{font-size:12px;font-weight:600;background:var(--nv-accent);color:var(--nv-on-accent);padding:4px 8px;border-radius:var(--nv-radius-badge);}
.nv-composicao{padding:16px 20px 12px;}
.nv-composicao-grafico{display:flex;align-items:center;gap:20px;}
.nv-composicao-legenda{display:flex;flex-direction:column;gap:9px;flex:1;min-width:0;}
.nv-composicao-item{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--nv-muted);display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nv-composicao-item b{color:var(--nv-fg);font-weight:600;margin-left:auto;padding-left:8px;}
.nv-composicao-bolinha{width:9px;height:9px;border-radius:50%;flex:none;}
.nv-ativo-linha{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--nv-hairline);cursor:pointer;background:none;width:100%;text-align:left;border-left:none;border-right:none;border-top:none;font-family:inherit;color:inherit;}
.nv-ativo-valor{text-align:right;}
.nv-ativo-rend{font-size:11px;font-weight:600;margin-top:3px;}
.nv-ativo-rend.positivo{color:var(--nv-positive);}
.nv-ativo-rend.negativo{color:var(--nv-negative);}

.banner{position:sticky;top:0;background:var(--nv-accent);color:#fff;text-align:center;padding:8px;font-size:.85rem;z-index:10;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;}
.banner-retry{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:6px;padding:3px 10px;font-size:.8rem;cursor:pointer;font-family:inherit;}
.somente-leitura [data-somente-leitura-esconde]{display:none !important;}

dialog{border:none;border-radius:var(--nv-radius-control);padding:20px;width:min(420px,90vw);background:var(--nv-bg);color:var(--nv-fg);}
dialog::backdrop{background:rgba(20,18,14,.55);}
dialog h3{font-weight:600;margin:0 0 12px;font-size:1.1rem;}
dialog label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;margin-bottom:10px;color:var(--nv-muted);}
dialog input,dialog select{font-family:inherit;font-size:1rem;padding:8px;border-radius:8px;border:1px solid var(--nv-rule-soft);background:var(--nv-bg);color:var(--nv-fg);}
/* Checkbox nativo sai no azul do sistema por padrão — accent-color traz pro vermelho da marca. */
dialog input[type="checkbox"]{accent-color:var(--nv-accent);padding:0;border:none;}
.form-acoes{display:flex;justify-content:flex-end;gap:8px;margin-top:8px;}
.form-acoes button{padding:8px 16px;border-radius:8px;border:1px solid var(--nv-rule-soft);background:var(--nv-bg);color:var(--nv-fg);cursor:pointer;font-family:inherit;}
.form-acoes button.primario{background:var(--nv-accent);border-color:var(--nv-accent);color:var(--nv-on-accent);}

/* ---- Camada de cartões ----------------------------------------------------------------------
   Leva a linguagem do Resumo para o resto do app. Vem depois das regras originais de propósito:
   as outras telas foram desenhadas em réguas duras de ponta a ponta, e aqui cada bloco passa a
   viver DENTRO de um cartão — que já dá a margem lateral e separa uma coisa da outra pelo espaço,
   não por uma linha. As classes antigas continuam as mesmas; o que muda é a superfície. */

.nv-tela--cartoes .nv-header{background:transparent;border-bottom:none;padding:16px 18px 4px;}
.nv-tela--cartoes .nv-header .nv-title{font-size:24px;}
/* Setas de mês viram botões redondos apoiados no chão: alvo de toque maior e coerente com o
   resto — no desenho antigo eram dois caracteres soltos sem área de clique nenhuma. */
.nv-tela--cartoes .nv-monthnav button[data-acao^="mes-"]{width:32px;height:32px;padding:0;border-radius:50%;background:var(--nv-surface);border:1px solid var(--nv-surface-borda);display:inline-flex;align-items:center;justify-content:center;font-size:18px;}
.nv-tela--cartoes .nv-back{width:34px;height:34px;border-radius:50%;background:var(--nv-surface);border:1px solid var(--nv-surface-borda);display:inline-flex;align-items:center;justify-content:center;font-size:19px;flex:none;}

/* Rótulo de seção solto no chão, entre dois cartões. */
.nv-pilha-titulo{font-size:11px;font-weight:600;letter-spacing:.12em;color:var(--nv-muted);text-transform:uppercase;padding:8px 4px 0;}

/* Lista de linhas dentro de um cartão: sem margem lateral própria (o cartão já dá), régua fraca
   entre as linhas e nenhuma na última — régua no fim do cartão duplicaria a borda dele. */
.nv-lista>*{padding-left:0;padding-right:0;border-bottom:1px solid var(--nv-surface-borda);}
.nv-cartao .nv-lista>*:first-child{padding-top:0;}
.nv-cartao .nv-lista>*:last-child{border-bottom:none;padding-bottom:0;}
.nv-lista .nv-item-nome{font-size:14px;}
.nv-lista .nv-item-valor{font-size:14.5px;}

/* O valor do lançamento entra em verde ou vermelho aqui também: fora do cartão essa cor vinha de
   .nv-item-valor, e a linha de cartão (.nv-linha-valor) tinha ficado sem regra nenhuma. */
.nv-linha-valor.positivo{color:var(--nv-positive);}
.nv-linha-valor.negativo{color:var(--nv-negative);}
/* Campo de valor dentro do cartão de saldo (novo lançamento) — mesma medida do número exibido. */
.nv-saldo-valor input{font-family:inherit;background:none;border:none;color:inherit;outline:none;padding:0;width:100%;font-size:44px;font-weight:600;line-height:.95;letter-spacing:-.035em;font-variant-numeric:tabular-nums;}
.nv-cartao .nv-row-plain{border-bottom-color:var(--nv-surface-borda);}

/* Blocos herdados que traziam o próprio recuo de 20px e a própria régua de fim de seção. */
.nv-cartao .nv-orcamento,.nv-cartao .nv-barras-meses,.nv-cartao .nv-patrimonio,
.nv-cartao .nv-perfil,.nv-cartao .nv-composicao,.nv-cartao .nv-calendario,.nv-cartao .nv-bars,
.nv-cartao .nv-list-plain,.nv-cartao .nv-alertas,.nv-cartao .nv-entrada-rapida,.nv-cartao .nv-cells{
  padding:0;border:none;
}
.nv-cartao .nv-cell{padding:0;}
.nv-cartao .nv-cell+.nv-cell{border-left:none;padding-left:18px;}
.nv-cartao .nv-vazio{padding:14px 0;}
.nv-cartao .nv-entrada-rapida-dica{padding:9px 2px 0;}
.nv-cartao .nv-barras-meses-grid{border-bottom:1px solid var(--nv-surface-borda);}
.nv-cartao .nv-calendario-rodape{border-top:1px solid var(--nv-surface-borda);margin-top:16px;}

/* Campos de formulário empilhados dentro de um cartão. */
.nv-cartao>.nv-campo-linha,.nv-cartao>.nv-linha-toggle,.nv-cartao>.nv-campo-dupla,.nv-cartao>.nv-meta-linha{
  padding-left:0;padding-right:0;border-bottom:1px solid var(--nv-surface-borda);
}
.nv-cartao>.nv-campo-linha:first-child,.nv-cartao>.nv-linha-toggle:first-child,.nv-cartao>.nv-campo-dupla:first-child{padding-top:0;}
.nv-cartao>.nv-campo-linha:last-child,.nv-cartao>.nv-linha-toggle:last-child,.nv-cartao>.nv-campo-dupla:last-child,.nv-cartao>.nv-meta-linha:last-child{border-bottom:none;padding-bottom:0;}
.nv-cartao .nv-campo-dupla>div{padding:12px 0;}
.nv-cartao .nv-campo-dupla>div:first-child{border-right:none;padding-right:14px;}
.nv-cartao .nv-campo-dupla>div+div{padding-left:14px;border-left:1px solid var(--nv-surface-borda);}
.nv-cartao .nv-campo-label{letter-spacing:.1em;font-size:10px;}
.nv-cartao .nv-campo-linha input,.nv-cartao .nv-campo-linha select,
.nv-cartao .nv-campo-dupla input,.nv-cartao .nv-campo-dupla select{margin-top:6px;}

/* Busca: pílula própria, apoiada no chão como um cartão baixo. */
.nv-busca{display:flex;align-items:center;gap:9px;background:var(--nv-surface);border:1px solid var(--nv-surface-borda);border-radius:var(--nv-radius-pill);box-shadow:var(--nv-sombra);padding:12px 16px;}
.nv-busca input{border:none;background:none;outline:none;font:inherit;font-size:14px;color:inherit;width:100%;}
.nv-busca input::placeholder{color:var(--nv-muted-2);}
.nv-busca svg{flex:none;color:var(--nv-muted);}

/* Filtros em pílula, rolando na horizontal sem barra visível. */
/* Sangra até a borda da tela: dentro do recuo da pilha o último filtro era cortado no meio de um
   vão vazio e parecia defeito, em vez de convidar a arrastar. */
.nv-tela--cartoes .nv-chips{margin:0 -14px;padding:2px 14px 0;gap:7px;scrollbar-width:none;}
.nv-tela--cartoes .nv-chips::-webkit-scrollbar{display:none;}
.nv-tela--cartoes .nv-chip{background:var(--nv-surface);border:1px solid var(--nv-surface-borda);box-shadow:var(--nv-sombra);padding:9px 14px;font-size:10.5px;color:var(--nv-muted);}
.nv-tela--cartoes .nv-chip.ativo{background:var(--nv-accent);border-color:var(--nv-accent);color:var(--nv-on-accent);}

/* Segmentado: trilho macio com a opção ativa em pílula, no lugar das abas de borda dura. */
.nv-tela--cartoes .nv-segmentado,.nv-segmentado-tema{display:flex;gap:4px;padding:4px;border:1px solid var(--nv-surface-borda);border-radius:var(--nv-radius-pill);background:var(--nv-surface);box-shadow:var(--nv-sombra);overflow:visible;}
.nv-tela--cartoes .nv-segmentado button,.nv-segmentado-tema button{flex:1;min-width:0;border:none;border-radius:var(--nv-radius-pill);padding:11px 4px;font-size:11px;letter-spacing:.06em;color:var(--nv-muted);background:none;}
.nv-tela--cartoes .nv-segmentado button.ativo,.nv-segmentado-tema button.ativo{background:var(--nv-accent);color:var(--nv-on-accent);}

/* Botões de ação: mesma altura e mesmo raio dos cartões, conteúdo centrado. */
.nv-tela--cartoes .nv-acao-fixa{padding:4px 0 0;}
.nv-tela--cartoes .nv-btn-cheio,.nv-tela--cartoes .nv-btn-contorno{justify-content:center;gap:9px;border-radius:var(--nv-raio-interno);padding:16px 18px;box-shadow:var(--nv-sombra);}
.nv-tela--cartoes .nv-btn-contorno{border:1px solid var(--nv-surface-borda);background:var(--nv-surface);}

/* Calendário: dia sem borda, tingido só quando teve movimento.
   min-width:0 é o que segura a grade dentro do cartão — item de grid tem largura mínima igual ao
   conteúdo, e um valor que não quebra alargava a coluna até a última passar da borda. */
.nv-tela--cartoes .nv-dia{border:none;background:var(--nv-surface-2);border-radius:11px;gap:3px;min-width:0;overflow:hidden;}
.nv-tela--cartoes .nv-dia-valor{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.nv-tela--cartoes .nv-dia-vazio{background:none;}
.nv-tela--cartoes .nv-dia-positivo{background:var(--nv-tint-pos);}
.nv-tela--cartoes .nv-dia-negativo{background:var(--nv-tint-neg);}
.nv-tela--cartoes .nv-grade,.nv-tela--cartoes .nv-dias-semana{gap:5px;}

/* Metas: cada meta é um cartão clicável; a que estourou fica tingida em vez de ganhar régua. */
.nv-meta-cartao{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;}
.nv-meta-cartao.excedida{background:var(--nv-tint-neg);border-color:transparent;}
.nv-tela--cartoes .nv-meta-track,.nv-tela--cartoes .nv-meta-fill{height:7px;}
.nv-tela--cartoes .nv-meta-fill{background:var(--nv-accent);}
.nv-tela--cartoes .nv-orcamento-fill{background:var(--nv-accent);}

/* Alerta dentro de cartão: fundo tingido no lugar da tarja lateral. */
.nv-cartao .nv-alerta{border-left:none;background:var(--nv-surface-2);border-radius:var(--nv-raio-interno);padding:12px 14px;}
.nv-cartao .nv-alerta--critico{background:var(--nv-tint-neg);}

/* Ativos e contas: linha com respiro, sem régua de ponta a ponta. */
.nv-tela--cartoes .nv-ativo-linha,.nv-tela--cartoes .nv-conta-linha,.nv-tela--cartoes .nv-item-lanc,
.nv-tela--cartoes .nv-dado-linha,.nv-tela--cartoes .nv-item{padding-top:13px;padding-bottom:13px;}
.nv-tela--cartoes .nv-conta-marcador{border:none;background:var(--nv-surface-2);width:34px;height:34px;border-radius:11px;font-size:13px;color:var(--nv-fg);}
.nv-tela--cartoes .nv-badge{background:var(--nv-surface-2);color:var(--nv-fg);padding:5px 10px;border-radius:var(--nv-radius-pill);}

/* Stepper de parcelas: um controle só, em pílula, no lugar de três caixas de borda dura
   encostadas — a do meio nem tinha lateral, o que fazia o número parecer solto entre dois botões. */
.nv-tela--cartoes .nv-stepper{background:var(--nv-surface-2);border-radius:var(--nv-radius-pill);padding:3px;gap:2px;}
.nv-tela--cartoes .nv-stepper button{border:none;background:var(--nv-surface);border-radius:50%;width:30px;height:30px;box-shadow:var(--nv-sombra);}
.nv-tela--cartoes .nv-stepper span{border:none;width:38px;height:30px;}

/* Rendimento: o selo segue o sinal. O acento da marca é vermelho, e um "+14%" em vermelho diz o
   contrário do que aconteceu — a mesma razão que já tinha levado "positivo" pro verde. */
.nv-carteira-badge{background:var(--nv-tint-pos);color:var(--nv-positive);}
.nv-carteira-badge--negativo{background:var(--nv-tint-neg);color:var(--nv-negative);}

/* Convite do teste de perfil: cartão de destaque, com o acento no botão. */
.nv-tela--cartoes .nv-perfil-convite{margin:0;border:none;border-radius:var(--nv-raio-cartao);background:var(--nv-surface);box-shadow:var(--nv-sombra);}
.nv-tela--cartoes .nv-perfil-cta{color:var(--nv-on-accent);padding:12px 20px;}

/* Rodapé do formulário: o saldo projetado é informação de apoio, não um bloco com régua dupla. */
.nv-tela--cartoes .nv-rodape-form{padding:8px 0 0;}
.nv-tela--cartoes .nv-rodape-saldo{border-top:none;padding:0 4px 4px;}
.nv-tela--cartoes .nv-rodape-versao{padding:16px 4px;text-align:center;}

/* Diálogos (novo ativo, conta, meta, dívida, operação) na mesma linguagem: são a metade do app
   que se preenche, e ficavam com a caixa quadrada e o campo de borda dura do desenho antigo. */
/* max-height + rolagem: o formulário de investimento tem sete campos e, num aparelho baixo, o
   botão Salvar ficava fora da tela sem nenhuma forma de alcançá-lo. */
dialog{background:var(--nv-surface);border-radius:var(--nv-raio-cartao);padding:22px 20px 18px;box-shadow:0 24px 60px -22px rgba(0,0,0,.5);max-height:88dvh;overflow-y:auto;}
dialog h3{font-size:17px;letter-spacing:-.01em;margin-bottom:16px;}
dialog label{gap:6px;margin-bottom:14px;}
dialog input,dialog select,dialog textarea,dialog .nv-combo-gatilho,dialog .nv-combo-input{
  border:1px solid var(--nv-surface-borda);background:var(--nv-surface-2);color:var(--nv-fg);
  border-radius:var(--nv-raio-interno);padding:12px;font-size:15px;
}
/* Depois das regras acima de propósito: caixa de marcação não é campo de texto e não pode herdar
   o preenchimento de 12px, senão vira um quadrado enorme ao lado do rótulo. */
dialog input[type="checkbox"]{accent-color:var(--nv-accent);padding:0;border:none;background:none;width:auto;flex:none;}
.nv-combo-lista{background:var(--nv-surface);border-color:var(--nv-surface-borda);border-radius:var(--nv-raio-interno);box-shadow:0 18px 40px -18px rgba(0,0,0,.45);}
.form-acoes{margin-top:16px;gap:10px;}
.form-acoes button{padding:12px 20px;border-radius:var(--nv-radius-pill);border:1px solid var(--nv-surface-borda);background:var(--nv-surface-2);font-size:12px;font-weight:600;letter-spacing:.08em;}
.form-acoes button.primario{background:var(--nv-accent);border-color:var(--nv-accent);color:var(--nv-on-accent);}
</style>

<dialog id="form-investimento">
  <form method="dialog" id="formulario-investimento">
    <h3>Investimento</h3>
    <input type="hidden" name="id" />
    <label for="campo-tipo-investimento">Tipo</label>
    <div id="combo-tipo-investimento"></div>
    <label for="campo-nome-ativo">Nome do ativo</label>
    <div id="combo-nome-ativo"></div>
    <!-- A primeira compra entra junto com o ativo: criar um ativo sem operação nenhuma deixava ele
         valendo R$ 0,00 até a pessoa entrar nele e lançar a compra à parte. Com quantidade e preço
         pago aqui, o preço médio já sai pronto. Só aparece na criação — depois a posição vem das
         operações, e mudar isso na mão contradiria o histórico. -->
    <div id="bloco-primeira-compra">
      <label id="linha-quantidade">Quantidade de cotas<input type="number" name="quantidade" step="0.00000001" min="0.00000001" value="1" /></label>
      <label><span id="rotulo-preco-pago">Preço pago por cota</span><input type="text" inputmode="decimal" name="precoPago" class="nv-campo-moeda" /></label>
      <label id="linha-data-compra">Data da compra<input type="date" name="dataCompra" /></label>
    </div>
    <label><span id="rotulo-preco-atual">Preço atual por cota</span><small style="display:block;color:var(--nv-muted);font-weight:400">em branco, usa o valor informado acima</small><input type="text" inputmode="decimal" name="precoAtual" class="nv-campo-moeda" /></label>
    <!-- O app não tem como saber sozinho se um ativo é resgatável hoje: quem diz é o usuário, e é
         isso que o alerta de reserva de emergência no Resumo usa como base. -->
    <label style="flex-direction:row;align-items:center;gap:10px;justify-content:space-between">
      <span>Conta como reserva de emergência<small style="display:block;color:var(--nv-muted);font-weight:400">só marque se der pra resgatar rápido</small></span>
      <input type="checkbox" name="reserva" style="width:auto;flex:none" />
    </label>
    <div class="form-acoes">
      <button type="button" id="botao-excluir-investimento" data-acao="excluir-investimento-atual" hidden style="margin-right:auto;color:var(--nv-negative);border-color:var(--nv-negative)">Excluir</button>
      <button type="button" data-acao="cancelar-form">Cancelar</button>
      <button type="submit" class="primario">Salvar</button>
    </div>
  </form>
</dialog>

<dialog id="form-operacao">
  <form method="dialog" id="formulario-operacao">

    <input type="hidden" name="ativoId" />

    <label>Preço unitário<input type="text" inputmode="decimal" name="precoUnitario" class="nv-campo-moeda" required /></label>
    <div class="form-acoes">
      <button type="button" data-acao="cancelar-form">Cancelar</button>
      <button type="submit" class="primario">Salvar</button>
    </div>
  </form>
</dialog>
